      responses:
        '200': { description: Owned entry }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Wellness]
      operationId: editWellnessEntry
      summary: Revise one owned wellness record
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: New entry version }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Wellness]
      operationId: deleteWellnessEntry
      summary: Soft delete one owned wellness record
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Soft deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /wellness/summary:
    get:
      tags: [Wellness]
      operationId: summarizeWellness
      summary: Calculate a descriptive wellness summary
      description: Local descriptive summary only; no diagnosis or treatment advice.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Owner-scoped counts and averages }
        '422': { $ref: '#/components/responses/ValidationError' }
  /diaries/drafts:
    get:
      tags: [Diary]
      operationId: listDiaryDrafts
      summary: List owned diary drafts
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Owner-scoped drafts }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Diary]
      operationId: createDiaryDraft
      summary: Create a draft from explicitly allowed source records
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryDraftRequest' }
      responses:
        '202':
          description: Draft generation accepted; not a finalized diary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts/{draft_id}:
    get:
      tags: [Diary]
      operationId: getDiaryDraft
      summary: Get one owned diary draft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200': { description: Owned draft }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Diary]
      operationId: reviseDiaryDraft
      summary: Revise an owned draft and advance its version
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_content_version, feedback]
              properties:
                base_content_version: { type: integer, minimum: 1 }
                feedback: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: New draft version; prior final approval is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts/{draft_id}/finalize:
    post:
      tags: [Diary]
      operationId: finalizeDiaryDraft
      summary: Save only the exactly approved current diary version
      description: >-
        The approval_id must refer to active approval_scope=final_diary for this exact
        draft, content_version and content_hash. Any other approval scope is rejected.
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash, approval_id]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                approval_id: { type: string, format: uuid }
      responses:
        '201':
          description: Final diary entry created after server checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts/{draft_id}/approvals:
    post:
      tags: [Diary]
      operationId: approveDiaryDraft
      summary: Approve an exact draft version for continuation or final saving
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash, approval_scope]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                approval_scope: { type: string, enum: [continue, final_diary] }
      responses:
        '201': { description: Version-bound approval }
        '409': { $ref: '#/components/responses/Conflict' }
  /diaries/entries:
    get:
      tags: [Diary]
      operationId: listDiaryEntries
      summary: List finalized owner-scoped diary entries
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Finalized owner-scoped entries }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /diaries/entries/{entry_id}:
    parameters:
      - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Diary]
      operationId: getDiaryEntry
      summary: Get one finalized owned diary entry
      responses:
        '200': { description: Owned finalized entry }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Diary]
      operationId: deleteDiaryEntry
      summary: Soft delete one finalized owned diary entry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Soft deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /diaries/entries/{entry_id}/revisions:
    post:
      tags: [Diary]
      operationId: beginDiaryEntryRevision
      summary: Create a new draft for editing an approved diary entry
      description: The saved entry remains unchanged until the revision draft receives both current-version approvals and is finalized.
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '201': { description: Revision draft created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: haejumi_web
      description: 'PC web only; mutating cookie requests require same-origin Origin and X-Haejumi-Web: 1.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: Proposed transport; token issuance and storage remain to be approved.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per operation attempt; scope and retention are approval items.
      schema: { type: string, minLength: 16, maxLength: 200 }
    ConsentId: { name: consent_id, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: upload_id, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
    PublicationId: { name: publication_id, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
    PublishId: { name: publish_id, in: path, required: true, schema: { type: string, format: uuid } }
    DraftId: { name: draft_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized:
      description: Missing, invalid or expired authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated but policy, scope, rights or approval gate denied the action
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource absent or not visible to this owner
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Stale version/approval, invalid state transition or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ValidationError:
      description: Request does not satisfy schema or policy input constraints
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PayloadTooLarge:
      description: Upload exceeds configured limit
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    UnsupportedMedia:
      description: Declared or detected media type is not accepted
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Rate limit reached
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unavailable:
      description: Required local worker or approved integration is unavailable; no publish is claimed
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error:
      description: Unexpected safe error; sensitive source text, tokens and private paths are excluded
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            item_index: { type: integer, minimum: 1, maximum: 30, description: One-based position of the selected upload item when validation can identify it. }
            field: { type: string, enum: [client_item_id, file_name, size_bytes, sha256, declared_media_type, file_structure, file_integrity, file_bytes] }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field: { type: string }
                  reason: { type: string }
        request_id: { type: string, format: uuid }
    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, AUTHENTICATION_REQUIRED, FORBIDDEN, RESOURCE_NOT_FOUND, CAPABILITY_NOT_FOUND, CAPABILITY_DISABLED, CONSENT_REQUIRED, PRIVACY_POLICY_DENIED, RIGHTS_BLOCKED, RIGHTS_REVIEW_REQUIRED, VERSION_CONFLICT, STALE_APPROVAL, APPROVAL_SCOPE_MISMATCH, INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, PUBLICATION_ALREADY_EXISTS, PUBLISH_ALREADY_EXISTS, PLATFORM_NOT_SUPPORTED, OAUTH_EXPIRED, RENDER_REQUIRED, RENDER_FAILED, FFMPEG_UNAVAILABLE, LLM_BUDGET_EXCEEDED, TRANSCRIPT_CONFIRMATION_REQUIRED, RATE_LIMITED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, SERVICE_UNAVAILABLE]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at]
      properties:
        access_token: { type: string, writeOnly: true }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    PrivacyPurpose:
      type: string
      enum: [llm_text, vision_analysis, diary_draft]
    PrivacyConsentGrant:
      type: object
      additionalProperties: false
      required: [provider_id, purpose, data_categories, notice_id, notice_version, explicitly_confirmed, expires_at]
      allOf:
        - if: { properties: { purpose: { const: vision_analysis } }, required: [purpose] }
          then:
            required: [resource_ids]
            properties:
              resource_ids: { minItems: 1 }
              data_categories:
                minItems: 2
                maxItems: 2
                allOf:
                  - contains: { const: selected_media }
                  - contains: { const: user_text }
        - if: { properties: { purpose: { const: llm_text } }, required: [purpose] }
          then: { properties: { data_categories: { const: [user_text] } } }
        - if: { properties: { purpose: { const: diary_draft } }, required: [purpose] }
          then:
            required: [resource_ids]
            properties:
              resource_ids: { maxItems: 30 }
              data_categories:
                minItems: 3
                maxItems: 3
                allOf:
                  - contains: { const: user_text }
                  - contains: { const: schedule }
                  - contains: { const: wellness }
      properties:
        provider_id: { type: string, const: openai }
        purpose: { $ref: '#/components/schemas/PrivacyPurpose' }
        data_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [selected_media, transcript, user_text, schedule, diary, wellness] }
        resource_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: For vision_analysis use exact selected media IDs; for diary_draft use exact selected Schedule and Wellness record IDs.
        notice_version: { type: string }
        notice_id: { type: string, format: uuid }
        explicitly_confirmed: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
    PrivacyConsent:
      type: object
      additionalProperties: false
      required: [consent_id, provider_id, purpose, data_categories, resource_ids, notice_id, notice_version, explicitly_confirmed, expires_at, status, created_at]
      properties:
        consent_id: { type: string, format: uuid }
        provider_id: { type: string, const: openai }
        purpose: { $ref: '#/components/schemas/PrivacyPurpose' }
        data_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [selected_media, transcript, user_text, schedule, diary, wellness] }
        resource_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        notice_version: { type: string }
        notice_id: { type: string, format: uuid }
        explicitly_confirmed: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked, expired] }
        created_at: { type: string, format: date-time }
    Capability:
      type: object
      additionalProperties: false
      required: [module_id, module_version, status, capability_ids, scopes, input_schema_version]
      properties:
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        agent_name: { type: string }
        module_version: { type: string }
        status: { type: string, enum: [enabled, disabled, planned] }
        implementation_status: { type: string, enum: [implemented, registered, extension_placeholder] }
        capability_ids: { type: array, items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' } }
        scopes: { type: array, items: { type: string } }
        input_schema_version: { type: string }
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 12000 }
        input_kind: { type: string, enum: [typed_text, confirmed_transcript] }
        confirmed_transcript: { type: boolean, default: false }
        attachment_ids: { type: array, items: { type: string, format: uuid } }
        task_id: { type: string, format: uuid, description: Existing owned Creator task; required to create a storyboard from its selected project media. }
        privacy_consent_id: { type: string, format: uuid, description: Optional active OpenAI llm_text or vision_analysis consent depending on request; does not enable external calls by itself. }
    AssistantMessageResponse:
      type: object
      additionalProperties: false
      required: [reply, route, status]
      properties:
        reply: { type: string }
        route: { type: string }
        status: { type: string, enum: [conversation, routed, needs_project, needs_clarification, needs_confirmation, completed_read, not_implemented, disabled, unsupported] }
        actions: { type: array, description: Read results or local write proposals requiring separate confirmation, items: { type: object, additionalProperties: true } }
        interpretation:
          type: object
          additionalProperties: false
          properties:
            source: { type: string, enum: [local_rules, mock, gateway] }
            gate_reason: { type: [string, 'null'] }
        agent_id: { type: [string, 'null'] }
        capability_id: { type: [string, 'null'] }
        task_id: { type: [string, 'null'], format: uuid }
        content_version: { type: [integer, 'null'], minimum: 1 }
        content_hash: { allOf: [{ $ref: '#/components/schemas/Sha256' }], type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/CreatorStoryboard' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        generation: { $ref: '#/components/schemas/GenerationMetadata' }
    CreatorPlanRequest:
      type: object
      additionalProperties: false
      required: [content_version, request_text]
      properties:
        content_version: { type: integer, minimum: 1, description: Current task version used as the concurrency precondition; stale versions on new requests are rejected with 409. An identical idempotent replay returns its recorded result. }
        request_text: { type: string, minLength: 1, maxLength: 4000 }
        privacy_consent_id: { type: string, format: uuid, description: Optional owner-bound consent for OpenAI vision analysis. }
        reference_ids: { type: array, maxItems: 8, uniqueItems: true, description: Owned reference candidates to record in the new plan. They are not sent to the external LLM or automatically copied into the output., items: { type: string, format: uuid } }
    CreatorSceneEditRequest:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, scenes]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        trend_query:
          type: [object, 'null']
          description: Optional cached trend query to record with this edit. Null clears the previous reference. A cache miss or irrelevant/stale result returns 409; this PUT never calls YouTube.
          additionalProperties: false
          required: [topic, days]
          properties:
            topic: { type: string, enum: [restaurant, cafe, travel] }
            days: { type: integer, minimum: 1, maximum: 90 }
            video_id: { type: string, pattern: '^[A-Za-z0-9_-]{11}$', description: Optional selected result from that cache entry. }
        reference_ids: { type: array, maxItems: 8, uniqueItems: true, description: Selected owned candidate IDs in priority order; changing this list increments content_version and invalidates approvals., items: { type: string, format: uuid } }
        scenes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [media_id, duration_seconds]
            properties:
              scene_id: { type: string, format: uuid, description: Existing stable scene identifier; omit for a new scene reusing selected project media. }
              media_id: { type: string, format: uuid }
              duration_seconds: { type: number, minimum: 0.1, maximum: 59 }
              visual_description: { type: string, maxLength: 500, description: User supplied description of what is actually visible; saved with a new content version. }
              trim_start_seconds: { type: number, minimum: 0, maximum: 3600, description: Video only; seek from this source position before rendering. }
              trim_end_seconds: { type: number, minimum: 0, maximum: 3600, description: Optional video source end position. Must leave at least duration_seconds after trim_start_seconds. }
              framing: { type: string, enum: [inherit, fit_pad, fill_crop, blur_pad] }
              motion: { type: string, enum: [static, zoom_in, zoom_out, pan_left, pan_right] }
              transition: { type: string, enum: [cut, fade] }
              subtitle_style: { type: string, enum: [default, emphasis, information] }
              edit_style: { type: string, enum: [basic, travel_warm, food_pop, cafe_soft, information], description: Optional local FFmpeg color grade and motion strength; source search metadata alone does not prove an editing technique. }
              bgm_mood: { type: string, maxLength: 100 }
              edit_reason: { type: string, maxLength: 500 }
    CreatorPlanResult:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, plan, checkpoint, generation]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        plan: { $ref: '#/components/schemas/CreatorStoryboard' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        generation: { $ref: '#/components/schemas/GenerationMetadata' }
    CreatorStoryboard:
      type: object
      additionalProperties: false
      required: [title_idea, format, aspect_ratio, target_seconds, scenes]
      properties:
        title_idea: { type: string, maxLength: 64 }
        theme: { type: string, maxLength: 500, description: Optional for older locally stored plans. }
        opening_hook: { type: string, maxLength: 500 }
        story_flow: { type: string, maxLength: 500 }
        mood: { type: string, maxLength: 500 }
        user_context:
          type: object
          additionalProperties: false
          description: Bounded local extraction from the user's request; separate from unverified visual observations and absent on older plans.
          required: [source, place, activities, emotion_terms, place_caption_requested, place_caption, place_caption_status]
          properties:
            source: { type: string, const: user_request }
            place: { type: [string, 'null'], maxLength: 80 }
            activities: { type: array, maxItems: 12, items: { type: string, maxLength: 12 } }
            emotion_terms: { type: array, maxItems: 12, items: { type: string, maxLength: 20 } }
            place_caption_requested: { type: boolean }
            place_caption: { type: [string, 'null'], maxLength: 80 }
            place_caption_status: { type: string, enum: [candidate, place_unrecognized, not_requested] }
        ending_line: { type: string, maxLength: 500 }
        recommended_media_order: { type: array, description: Suggested order only; actual order changes require a versioned scene edit and new approval., items: { type: string, format: uuid } }
        style_reference_ids: { type: array, maxItems: 8, items: { type: string, format: uuid } }
        style_references: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/StyleReference' } }
        style_application:
          type: object
          description: Only local effects applied to the initial storyboard; reference media is not copied or sent to a provider.
          properties:
            source: { type: string, const: haejumi_local_rules }
            applied_fields: { type: array, items: { type: string } }
            limitation: { type: string }
        trend_reference:
          type: object
          description: Optional source evidence from cached YouTube titles/descriptions and public metrics. No reference video effects were inspected.
          additionalProperties: false
          required: [source, analysis_scope, topic, queried_at, period_days, keywords, title_patterns, references]
          properties:
            source: { type: string, const: youtube_data_api }
            analysis_scope: { type: string, const: metadata_only }
            topic: { type: string, enum: [restaurant, cafe, travel] }
            queried_at: { type: string, format: date-time }
            period_days: { type: integer, minimum: 1, maximum: 90 }
            keywords: { type: array, items: { type: string } }
            title_patterns: { type: array, description: Allowlisted expressions actually present in relevant video titles; not copied title text., items: { type: string } }
            references:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [url, published_at, view_count]
                properties:
                  url: { type: string, format: uri }
                  published_at: { type: string, format: date-time }
                  view_count: { type: [integer, 'null'], minimum: 0 }
        publication_suggestions:
          type: array
          description: Draft text only; account and visibility are never selected and no publication occurs.
          items:
            type: object
            required: [platform, title, description, hashtags]
            properties:
              platform: { type: string, enum: [youtube, tiktok, instagram] }
              title: { type: string, maxLength: 200 }
              description: { type: string, maxLength: 5000 }
              hashtags: { type: array, maxItems: 30, items: { type: string, maxLength: 100 } }
        media_insights:
          type: array
          description: One insight per selected media in project order. Visual claims for unsampled media must remain uncertain.
          items:
            type: object
            required: [media_id, description, mood, subjects, usable_detail, uncertainty]
            properties:
              media_id: { type: string, format: uuid }
              description: { type: string, maxLength: 500 }
              caption_suggestion: { type: string, maxLength: 80, description: 'Optional short Korean subtitle candidate from a new per-media analysis. It is separate from the visual description, remains unverified, and is absent for legacy results.' }
              mood: { type: string, maxLength: 500 }
              subjects: { type: array, maxItems: 12, items: { type: string, maxLength: 80 } }
              usable_detail: { type: string, maxLength: 500 }
              uncertainty: { type: string, maxLength: 500 }
              category: { type: string, enum: [food, cafe, travel, other, unknown] }
              orientation: { type: string, enum: [landscape, portrait, square, unknown] }
              analysis_provenance:
                type: object
                additionalProperties: false
                description: Optional provenance for a new Vision insight; absent for local and legacy plans. The model description remains unverified.
                required: [analysis_id, source, model, analyzed_at, content_version, sample_sha256]
                properties:
                  analysis_id: { type: string, format: uuid }
                  source: { type: string, enum: [vision, vision_per_media, mock] }
                  model: { type: [string, 'null'], maxLength: 100 }
                  analyzed_at: { type: string, format: date-time }
                  content_version: { type: [integer, 'null'], minimum: 1 }
                  sample_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: Hash of the reduced local sample; sample bytes are not stored here. }
        format: { type: string, const: vertical_short }
        aspect_ratio: { type: string, const: '9:16' }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        scenes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order, media_id, media_type, start_seconds, end_seconds, visual_direction, caption_text]
            properties:
              scene_id: { type: string, format: uuid, description: Stable ID of this edit scene; legacy projects may not contain it until edited. }
              order: { type: integer, minimum: 1 }
              media_id: { type: string, format: uuid }
              media_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime] }
              visual_description: { type: string, maxLength: 500 }
              visual_analysis_status: { type: string, enum: [unavailable, ai_unverified, user_described] }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59 }
              trim_start_seconds: { type: number, minimum: 0, maximum: 3600 }
              trim_end_seconds: { type: number, minimum: 0, maximum: 3600 }
              visual_direction: { type: string, maxLength: 500 }
              caption_text: { type: string, maxLength: 80, description: Optional scene suggestion; may be empty and is never copied into the render subtitle timeline. }
              framing: { type: string, enum: [inherit, fit_pad, fill_crop, blur_pad] }
              motion: { type: string, enum: [static, zoom_in, zoom_out, pan_left, pan_right] }
              transition: { type: string, enum: [cut, fade] }
              subtitle_style: { type: string, enum: [default, emphasis, information] }
              edit_style: { type: string, enum: [basic, travel_warm, food_pop, cafe_soft, information] }
              bgm_mood: { type: string, maxLength: 100 }
              edit_reason: { type: string, maxLength: 500 }
    StyleReference:
      type: object
      additionalProperties: false
      required: [reference_id, kind, analysis_scope, note, created_at]
      properties:
        reference_id: { type: string, format: uuid }
        kind: { type: string, enum: [trend, search, url, upload] }
        video_id: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        platform: { type: [string, 'null'], enum: [youtube, instagram, tiktok, null] }
        url: { type: string, format: uri }
        media_id: { type: string, format: uuid }
        topic: { type: string, enum: [restaurant, cafe, travel] }
        days: { type: integer, minimum: 1, maximum: 90 }
        analysis_scope: { type: string, enum: [metadata_only, local_video_sample, none] }
        limitation: { type: string }
        note: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        trend_summary:
          type: object
          description: Common topic and title terms from fresh YouTube metadata only; not video effects.
          properties:
            source: { type: string, const: youtube_data_api }
            analysis_scope: { type: string, const: metadata_only }
            topic: { type: string, enum: [restaurant, cafe, travel] }
            queried_at: { type: string, format: date-time }
            period_days: { type: integer }
            keywords: { type: array, items: { type: string } }
            title_patterns: { type: array, items: { type: string } }
            references:
              type: array
              items:
                type: object
                properties:
                  url: { type: string, format: uri }
                  published_at: { type: string, format: date-time }
                  view_count: { type: [integer, 'null'] }
        metadata:
          type: [object, 'null']
          properties:
            title: { type: string }
            description: { type: string }
            published_at: { type: [string, 'null'], format: date-time }
            view_count: { type: [integer, 'null'] }
            like_count: { type: [integer, 'null'] }
            duration_seconds: { type: [number, 'null'] }
            shorts_status: { type: string, const: unconfirmed }
        analysis:
          type: object
          description: Local FFprobe and sampled FFmpeg observations only, not a semantic or copyright analysis.
          properties:
            duration_seconds: { type: number }
            width: { type: integer }
            height: { type: integer }
            aspect_ratio: { type: number }
            analyzed_seconds: { type: number }
            cut_times_seconds: { type: array, items: { type: number } }
            average_cut_seconds: { type: [number, 'null'] }
            cut_detection: { type: string, enum: [sampled_scene_threshold, unavailable] }
            pace: { type: string, enum: [fast, medium, slow, unknown] }
            limitations: { type: array, items: { type: string } }
    TrendSearchResult:
      type: object
      required: [status, source, topic, period, analysis_scope, items]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        reason: { type: string, enum: [API_NOT_ENABLED, API_LIMITED, API_UNAVAILABLE] }
        source: { type: string, enum: [youtube_data_api, local_fallback] }
        topic: { type: string, enum: [restaurant, cafe, travel] }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        analysis_scope: { type: string, enum: [metadata_only, none] }
        suggestion: { type: string }
        items:
          type: array
          items:
            type: object
            required: [video_id, url, title, published_at, view_count, like_count, comment_count, duration_seconds, analysis_scope]
            properties:
              video_id: { type: string }
              url: { type: string, format: uri }
              title: { type: string }
              published_at: { type: [string, 'null'], format: date-time }
              view_count: { type: [integer, 'null'] }
              like_count: { type: [integer, 'null'] }
              comment_count: { type: [integer, 'null'] }
              duration_seconds: { type: integer }
              shorts_status: { type: string, const: unconfirmed }
              analysis_scope: { type: string, const: metadata_only }
    CreatorDraft:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, captions, composition, checkpoint]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        captions:
          type: array
          description: Renderable subtitle timeline. Zero or multiple non-overlapping captions may fall within a scene; each caption must fit entirely inside one scene. Local rules produce an empty timeline for user editing.
          items:
            type: object
            additionalProperties: false
            required: [order, start_seconds, end_seconds, text]
            properties:
              order: { type: integer, minimum: 1 }
              scene_id: { type: string, format: uuid }
              media_id: { type: string, format: uuid }
              caption_source: { type: string, enum: [vision, user, legacy_review] }
              caption_status: { type: string, enum: [needs_review] }
              caption_kind: { type: string, enum: [observed_fact, user_information, emotional, narrative, unclassified], description: 'Model suggested content type, not a factual verification.' }
              caption_review_reason: { type: string, enum: [visual_fact_unverified, user_fact_unverified, editorial_confirmation, kind_unclassified] }
              caption_basis:
                type: object
                additionalProperties: false
                description: Optional Vision evidence candidate for user review; absent for legacy or user edited captions.
                required: [media_id, analysis_id, insight_description, model_evidence]
                properties:
                  media_id: { type: string, format: uuid }
                  analysis_id: { type: [string, 'null'], format: uuid }
                  insight_description: { type: string, maxLength: 500 }
                  model_evidence: { type: string, maxLength: 240 }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59 }
              text: { type: string, maxLength: 80 }
        composition:
          anyOf:
            - { $ref: '#/components/schemas/CreatorComposition' }
            - { type: 'null' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
    CreatorComposition:
      type: object
      additionalProperties: false
      required: [captions_enabled, music_track_id, source_volume, music_volume, fade_in_seconds, fade_out_seconds]
      properties:
        captions_enabled: { type: boolean }
        music_track_id: { type: [string, 'null'], format: uuid }
        source_volume: { type: number, minimum: 0, maximum: 2 }
        music_volume: { type: number, minimum: 0, maximum: 2 }
        fade_in_seconds: { type: number, minimum: 0, maximum: 10, description: Must not exceed half the project duration. }
        fade_out_seconds: { type: number, minimum: 0, maximum: 10, description: Must not exceed half the project duration. }
        source_audio_rights: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/SourceAudioRight' } }
    CreatorDraftEdit:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, captions, captions_enabled, music_track_id, source_volume, music_volume, fade_in_seconds, fade_out_seconds]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        captions:
          type: array
          maxItems: 30
          description: Sorted, non-overlapping subtitle intervals within individual approved scenes. Placeholder text and planning instructions are rejected.
          items:
            type: object
            additionalProperties: false
            required: [order, start_seconds, end_seconds, text]
            properties:
              order: { type: integer, minimum: 1, description: Must match its one-based array position. }
              scene_id: { type: string, format: uuid, description: If present must match the scene containing this caption interval. }
              media_id: { type: string, format: uuid, description: If present must match the scene source media. }
              caption_source: { type: string, enum: [vision, user, legacy_review], description: Readback metadata; edits are stored as user captions. }
              caption_status: { type: string, enum: [needs_review], description: Readback metadata; draft approval is the user review checkpoint. }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59, description: Must be after start and at most the project duration. }
              text: { type: string, maxLength: 80, description: 'Korean, supported ASCII and selected punctuation; control characters and unsupported glyphs are rejected.' }
        captions_enabled: { type: boolean }
        music_track_id: { type: [string, 'null'], format: uuid }
        source_volume: { type: number, minimum: 0, maximum: 2 }
        music_volume: { type: number, minimum: 0, maximum: 2 }
        fade_in_seconds: { type: number, minimum: 0, maximum: 10 }
        fade_out_seconds: { type: number, minimum: 0, maximum: 10 }
        source_audio_rights: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/SourceAudioRight' }, description: Optional per-video rights assertions; omitted preserves existing assertions. }
    SourceAudioRight:
      type: object
      additionalProperties: false
      required: [media_id, explicitly_verified, commercial_allowed, platforms, evidence, attribution_required, required_attribution]
      description: User-attested rights for source video audio; the media ID must belong to the project. Audible source audio without valid platform-specific rights blocks final approval.
      properties:
        media_id: { type: string, format: uuid }
        explicitly_verified: { type: boolean }
        commercial_allowed: { type: boolean }
        platforms: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/PublishPlatform' } }
        evidence: { type: string, maxLength: 4000 }
        attribution_required: { type: boolean }
        required_attribution: { type: string, maxLength: 2000 }
    CreatorDraftEditResult:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, checkpoint]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
    MusicRights:
      type: object
      additionalProperties: false
      required: [source_url, license_name, license_version, license_url, evidence, downloaded_at, attribution_required, required_attribution, commercial_allowed, platforms, explicitly_verified]
      description: User-attested evidence; explicit verification requires nonempty source, license name/version/URL, evidence, download date, commercial permission and at least one permitted platform. Attribution, when required, must appear in the publication description.
      properties:
        source_url: { type: string, maxLength: 2000 }
        license_name: { type: string, maxLength: 300 }
        license_version: { type: string, maxLength: 200 }
        license_url: { type: string, maxLength: 2000 }
        evidence: { type: string, maxLength: 4000 }
        downloaded_at: { type: string, description: YYYY-MM-DD or empty while unverified. }
        attribution_required: { type: boolean }
        required_attribution: { type: string, maxLength: 2000 }
        commercial_allowed: { type: boolean }
        platforms: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/PublishPlatform' } }
        explicitly_verified: { type: boolean }
    MusicTrackCreate:
      type: object
      additionalProperties: false
      required: [title, artist, format, size_bytes, sha256, rights]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        artist: { type: string, minLength: 1, maxLength: 200 }
        format: { type: string, enum: [wav, mp3] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        rights: { $ref: '#/components/schemas/MusicRights' }
    MusicTrack:
      type: object
      additionalProperties: false
      required: [track_id, title, artist, format, size_bytes, sha256, rights, rights_revision, rights_status, status]
      properties:
        track_id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string }
        format: { type: string, enum: [wav, mp3] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        rights: { $ref: '#/components/schemas/MusicRights' }
        rights_revision: { type: integer, minimum: 1 }
        rights_status: { type: string, enum: [unverified, user_verified] }
        status: { type: string, enum: [awaiting_upload, available] }
    GenerationMetadata:
      type: object
      additionalProperties: false
      required: [source, fallback_used, llm_calls, estimated_cost_usd, gate_reason]
      properties:
        source: { type: string, enum: [mock, gateway, local_rules] }
        fallback_used: { type: boolean }
        llm_calls: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0 }
        gate_reason: { type: [string, 'null'] }
        planning_source: { type: string, enum: [vision_text_plan, local_from_vision], description: Optional per-media Vision result; local composition is used when the task call limit leaves no story call. }
        caption_refinement:
          type: object
          additionalProperties: false
          description: Local request-to-caption check; does not mean a user supplied place or model observation was visually verified.
          required: [requested_caption_added, repeated_location_prefixes_removed]
          properties:
            requested_caption_required: { type: boolean }
            requested_caption_text: { type: [string, 'null'], maxLength: 80 }
            requested_caption_added: { type: boolean }
            requested_caption_reflected: { type: boolean }
            requested_caption_unmet_reason: { type: [string, 'null'], enum: [PLACE_UNRECOGNIZED, NO_VALID_VISUAL_ANALYSIS, CAPTION_TIMELINE_UNAVAILABLE, null] }
            repeated_location_prefixes_removed: { type: integer, minimum: 0 }
            generic_location_captions_omitted: { type: integer, minimum: 0 }
        caption_style_review:
          type: object
          additionalProperties: false
          description: Local whole-video wording checks; photo meaning and naturalness still require user review.
          required: [duplicate_captions_omitted, repeated_endings_for_review, formal_endings_for_review]
          properties:
            duplicate_captions_omitted: { type: integer, minimum: 0 }
            repeated_endings_for_review: { type: integer, minimum: 0 }
            formal_endings_for_review: { type: integer, minimum: 0 }
        media_analysis:
          type: array
          description: Optional per-media Vision result in selected project order; photo descriptions still require user review.
          items:
            type: object
            additionalProperties: false
            required: [media_id, status]
            properties:
              media_id: { type: string, format: uuid }
              status: { type: string, enum: [analyzed, cached, failed, skipped, unavailable] }
              analysis_request_id: { type: string, format: uuid, description: Local per-image attempt identifier; not a provider request ID. }
              reason: { type: string, description: Safe error code only; no media or provider response text. }
              request_type: { type: string, enum: [per_media_vision] }
              model: { type: [string, 'null'], maxLength: 100 }
              response_status: { type: string, enum: [parsed_json, invalid_response, unavailable] }
              diagnostic: { anyOf: [{ $ref: '#/components/schemas/VisionOutputDiagnostic' }, { type: 'null' }] }
              caption_status: { type: string, enum: [needs_review, unavailable], description: Subtitle candidate status; separate from image analysis success. }
              caption_reason: { type: string, description: Safe reason code for an unusable or absent subtitle candidate. }
              caption_diagnostic: { $ref: '#/components/schemas/VisionOutputDiagnostic' }
        story_analysis:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [skipped, applied, failed] }
            calls: { type: integer, minimum: 0, maximum: 1, description: Locally reserved text-only story attempts. }
            reason: { type: string, description: Safe failure code; no provider text. }
            diagnostic: { anyOf: [{ $ref: '#/components/schemas/VisionOutputDiagnostic' }, { type: 'null' }] }
        vision_call_plan:
          type: object
          additionalProperties: false
          required: [required, cached]
          properties:
            required: { type: integer, minimum: 0, description: Uncached visual samples needing one call each. }
            remaining: { type: integer, description: Remaining calls on the parent Creator task before this request. }
            cached: { type: integer, minimum: 0 }
            planning_call: { type: integer, enum: [0, 1] }
        validation_field: { type: string, enum: [PLAN_MISSING, SCENES_MEDIA_MISMATCH, CAPTIONS_FORMAT, CAPTIONS_UNUSABLE] }
        diagnostic:
          type: object
          additionalProperties: false
          properties:
            provider_http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
            provider_request_id: { type: [string, 'null'], maxLength: 128 }
            stage: { type: string, enum: [waiting_headers, reading_body, validating_output], description: Local phase at failure; does not prove provider delivery. }
            elapsed_ms: { type: integer, minimum: 0 }
            timeout_ms: { type: integer, minimum: 1000 }
            request_bytes: { type: integer, minimum: 0, description: JSON request size only; no request content. }
            gateway_elapsed_ms: { type: integer, minimum: 0 }
            request_started: { type: boolean, description: Local fetch invocation only; provider delivery is not proven. }
            headers_received: { type: boolean }
            body_received: { type: boolean }
            preparation_elapsed_ms: { type: integer, minimum: 0 }
            prepared_samples: { type: integer, minimum: 0 }
            prepared_bytes: { type: integer, minimum: 0 }
            preparation_failures: { type: integer, minimum: 0 }
    VisionOutputDiagnostic:
      type: object
      additionalProperties: false
      description: Safe field-level or provider diagnostic without image, prompt, or model output text.
      properties:
        validation_code: { type: string }
        field_path: { type: string }
        expected_type: { type: string }
        actual_type: { type: string }
        missing_required_fields: { type: array, items: { type: string } }
        json_parse_succeeded: { type: [boolean, 'null'] }
        output_truncated: { type: boolean }
        provider_http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        provider_request_id: { type: [string, 'null'], maxLength: 128 }
        stage: { type: string, enum: [waiting_headers, reading_body, validating_output] }
        elapsed_ms: { type: integer, minimum: 0 }
        timeout_ms: { type: integer, minimum: 1000 }
        request_bytes: { type: integer, minimum: 0 }
        gateway_elapsed_ms: { type: integer, minimum: 0 }
        request_started: { type: boolean }
        headers_received: { type: boolean }
        body_received: { type: boolean }
    Transcript:
      type: object
      additionalProperties: false
      required: [transcript_id, text, confirmed, audio_retained]
      properties:
        transcript_id: { type: string, format: uuid }
        text: { type: string }
        confirmed: { type: boolean, const: false }
        audio_retained: { type: boolean, const: false }
    UploadInitRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        project_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [client_item_id, file_name, declared_media_type, size_bytes, sha256]
            properties:
              client_item_id: { type: string, format: uuid }
              file_name: { type: string, minLength: 1, maxLength: 255 }
              declared_media_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime] }
              size_bytes: { type: integer, minimum: 1 }
              sha256: { $ref: '#/components/schemas/Sha256' }
    UploadSession:
      type: object
      additionalProperties: false
      required: [upload_id, status, expires_at, accepted_items]
      properties:
        upload_id: { type: string, format: uuid }
        status: { type: string, enum: [created, uploading, completed, rejected, expired] }
        expires_at: { type: string, format: date-time }
        accepted_items:
          type: array
          items:
            type: object
            required: [client_item_id, received_parts]
            properties:
              client_item_id: { type: string, format: uuid }
              received_parts: { type: array, items: { type: integer, minimum: 1 } }
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      description: >-
        The adapter hashes UTF-8 bytes of compact JSON for an ordered array with
        each object in this field order: client_item_id (lowercase UUID),
        sha256 (lowercase hex) and size_bytes (integer). This canonicalization is
        provisional and remains pending API approval. For multi-item sessions items
        is required and must match the upload session exactly. Single-item sessions
        may omit items for backward compatibility.
      required: [manifest_sha256]
      properties:
        manifest_sha256: { allOf: [{ $ref: '#/components/schemas/Sha256' }], description: SHA-256 of the provisional canonical manifest described above. }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [client_item_id, sha256, size_bytes]
            properties:
              client_item_id: { type: string, format: uuid }
              sha256: { $ref: '#/components/schemas/Sha256' }
              size_bytes: { type: integer, minimum: 1 }
    MediaImport:
      type: object
      additionalProperties: false
      required: [import_id, status, media, manifest_sha256, proposal]
      properties:
        import_id: { type: string, format: uuid }
        status: { type: string, enum: [completed, rejected] }
        manifest_sha256: { $ref: '#/components/schemas/Sha256' }
        media: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }
        proposal:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [created, already_created, suppressed] }
            proposal_id: { type: string, format: uuid }
    MediaAsset:
      type: object
      additionalProperties: false
      required: [media_id, media_type, media_type_verified, size_bytes, sha256, status]
      properties:
        media_id: { type: string, format: uuid }
        media_type: { type: string }
        media_type_verified: { type: boolean, description: Signature and container-structure checks passed; this does not assert full codec decoding. }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        status: { type: string, enum: [available, quarantined, deleted] }
        captured_at: { type: string, format: date-time }
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [media_ids]
      properties:
        media_ids: { type: array, minItems: 1, maxItems: 30, uniqueItems: true, items: { type: string, format: uuid }, description: Default server limit is 20; configurable up to 30. }
        style: { type: string, maxLength: 80 }
        target_seconds: { type: integer, minimum: 3, maximum: 59, default: 30, description: Desired video duration in seconds; accepted range is 3 through 59 (60 is excluded). }
        aspect_ratio: { type: string, const: '9:16' }
        framing: { type: string, enum: [fit_pad, fill_crop], default: fit_pad }
        focal_x: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        focal_y: { type: number, minimum: 0, maximum: 1, default: 0.5 }
    ContentProject:
      type: object
      additionalProperties: false
      required: [project_id, task_id, status, current_version, media_ids]
      properties:
        project_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: Proposed initial task created with this project; approval pending. }
        status: { type: string, enum: [created, planning, review_required, rendering, ready, blocked, failed] }
        current_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        media_ids: { type: array, items: { type: string, format: uuid } }
        media_manifest:
          type: array
          description: Server-verified selected media in project order. Older projects may omit this field.
          items:
            type: object
            additionalProperties: false
            required: [order, media_id, sha256]
            properties:
              order: { type: integer, minimum: 1 }
              media_id: { type: string, format: uuid }
              sha256: { $ref: '#/components/schemas/Sha256' }
        style: { type: string, maxLength: 80 }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        aspect_ratio: { type: string, const: '9:16' }
        framing: { type: string, enum: [fit_pad, fill_crop] }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      description: The Registry validates module_id, capability_id and input_schema_version before accepting input.
      required: [module_id, capability_id, input_schema_version, input]
      properties:
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        capability_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        input_schema_version: { type: string, minLength: 1, maxLength: 64 }
        project_id: { type: string, format: uuid }
        confirmed_transcript: { type: boolean, default: false }
        input: { type: object, additionalProperties: true }
    Task:
      type: object
      additionalProperties: false
      required: [task_id, module_id, capability_id, status, current_version, created_at]
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        capability_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        status:
          type: string
          enum: [created, planning, waiting_plan_approval, drafting, waiting_draft_approval, render_ready, revising, rendering, render_simulated, waiting_preview_approval, preview_approved, waiting_final_publish_approval, waiting_final_diary_approval, ready_to_publish, publish_queued, publishing, outcome_unknown, reconciling, needs_user_action, published, saved, on_hold, cancelled, failed, rights_blocked, stale_approval]
        current_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        next_action: { type: string, enum: [review_plan, review_draft, review_preview, final_approval, none] }
        active_job_id: { type: string, format: uuid }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Checkpoint:
      type: object
      additionalProperties: false
      description: >-
        Current Creator implementation uses plan/draft/preview + continue. Platform final
        publication approvals are stored on publication resources; final_diary remains a
        future Diary capability and cannot be accepted by the generic Creator endpoint.
      required: [checkpoint_id, kind, status, content_version, content_hash, approval_scope]
      properties:
        checkpoint_id: { type: string, format: uuid }
        kind: { type: string, enum: [plan, draft, preview, final_publish, final_diary] }
        status: { type: string, enum: [pending, approved, revision_requested, on_hold, cancelled, invalidated] }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, enum: [continue, final_publish, final_diary] }
        summary: { type: string, maxLength: 500 }
        approval_id: { type: string, format: uuid }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [checkpoint_id, content_version, content_hash, approval_scope]
      properties:
        checkpoint_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, const: continue }
    Approval:
      type: object
      additionalProperties: false
      description: >-
        content_hash binds the canonical content version; approval_hash binds scope,
        checkpoint, version/hash and, for final_publish, artifact_sha256 and publish_target.
      required: [approval_id, task_id, checkpoint_id, content_version, content_hash, approval_hash, approval_scope, status, approved_at]
      properties:
        approval_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, enum: [continue, final_publish, final_diary] }
        status: { type: string, enum: [active, invalidated, consumed] }
        publish_target: { $ref: '#/components/schemas/PublishTarget' }
        approved_at: { type: string, format: date-time }
    Job:
      type: object
      additionalProperties: false
      required: [job_id, task_id, kind, status, progress_percent]
      properties:
        job_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind: { type: string, enum: [render, transcription, external_processing] }
        status: { type: string, enum: [queued, running, succeeded, simulated, failed, cancelled, blocked, outcome_unknown, reconciling, needs_user_action] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        safe_error_code: { type: string }
        failure_stage: { type: string, enum: [ffmpeg_start, ffmpeg_encode] }
        ffmpeg_exit_code: { type: integer, minimum: 0, maximum: 255 }
        diagnostic_code: { type: string, enum: [INPUT_UNAVAILABLE, INPUT_FORMAT, FILTER_OR_ENCODER, UNKNOWN] }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        renderer_mode: { type: string, enum: [ffmpeg, test] }
        video_reused: { type: boolean, description: Previously verified video stream was reused for an audio-only change. }
        source_audio_media_ids: { type: array, items: { type: string, format: uuid }, description: Source video IDs for which ffprobe detected an audio stream. }
        artifact_verified: { type: boolean }
        preview_ready: { type: boolean }
        render_profile: { type: string, enum: [vertical_9_16_h264_aac] }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        framing: { type: string, enum: [fit_pad, fill_crop] }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    PublishPlatform:
      type: string
      enum: [youtube, instagram, tiktok]
    YouTubeConnection:
      type: object
      required: [configured, connected, status, channel_id, channel_title]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        status: { type: string, enum: [unconfigured, connected, disconnected, reauth_required] }
        channel_id: { type: [string, 'null'] }
        channel_title: { type: [string, 'null'] }
    YouTubeUpload:
      type: object
      required: [upload_id, task_id, publication_id, status, channel_id, content_version, made_for_kids, artifact_sha256, video_id, url, created_at, completed_at]
      properties:
        upload_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        publication_id: { type: string, format: uuid }
        status: { type: string, enum: [uploading, succeeded, outcome_unknown] }
        channel_id: { type: string }
        content_version: { type: integer, minimum: 1 }
        made_for_kids: { type: boolean }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        video_id: { type: [string, 'null'] }
        url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    PublicationInput:
      type: object
      additionalProperties: false
      required: [platform, account_id, visibility, title, description, hashtags]
      properties:
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, minLength: 1, maxLength: 128, description: Opaque platform account identifier; never an access token. }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        hashtags: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 100 } }
    PublicationRecord:
      allOf:
        - $ref: '#/components/schemas/PublicationInput'
        - type: object
          required: [publication_id, task_id, revision, metadata_hash, status, created_at, updated_at]
          properties:
            publication_id: { type: string, format: uuid }
            task_id: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            metadata_hash: { $ref: '#/components/schemas/Sha256' }
            status: { type: string, enum: [draft, publish_ready] }
            approval_id: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PublicationApprovalRequest:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, artifact_sha256, publication_revision, publication_hash]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        publication_revision: { type: integer, minimum: 1 }
        publication_hash: { $ref: '#/components/schemas/Sha256' }
    PublicationApproval:
      type: object
      additionalProperties: false
      required: [approval_id, task_id, publication_id, platform, account_id, visibility, title, description, hashtags, content_version, content_hash, artifact_sha256, publication_revision, publication_hash, approval_scope, approval_hash, status, approved_at]
      properties:
        approval_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        publication_id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, minLength: 1, maxLength: 128 }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        hashtags: { type: array, maxItems: 30, items: { type: string } }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        publication_revision: { type: integer, minimum: 1 }
        publication_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { const: final_publish }
        approval_hash: { $ref: '#/components/schemas/Sha256' }
        status: { type: string, enum: [active, invalidated] }
        approved_at: { type: string, format: date-time }
    PublishTarget:
      type: object
      additionalProperties: false
      required: [platform, account_id, visibility, caption]
      properties:
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        caption: { type: string, maxLength: 5000 }
    RightsDecision:
      type: object
      additionalProperties: false
      required: [decision, content_version, content_hash, platform, checked_at, reasons]
      properties:
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        checked_at: { type: string, format: date-time }
        reasons: { type: array, items: { type: string } }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [task_id, project_id, content_version, content_hash, artifact_sha256, approval_id, platform, account_id, visibility, caption]
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        caption: { type: string, maxLength: 5000 }
    PublishJob:
      type: object
      additionalProperties: false
      required: [publish_id, status, mode, platform, content_version, content_hash, artifact_sha256, approval_id]
      properties:
        publish_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, uploading, outcome_unknown, reconciling, succeeded, failed, blocked, needs_user_action] }
        mode: { type: string, enum: [mock, real] }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_id: { type: string, format: uuid }
        external_id: { type: string }
        url: { type: string, format: uri }
        safe_error_code: { type: string }
        reconciliation_status: { type: string, enum: [not_needed, pending, querying_platform, matched_success, matched_failure, inconclusive, user_action_required] }
        platform_operation_id: { type: string }
        next_retry_at: { type: string, format: date-time, description: 'Only for safe reconciliation queries; never signals blind re-upload.' }
    ScheduleEventInput:
      type: object
      additionalProperties: false
      required: [title, start_at, end_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        notes: { type: string, maxLength: 4000 }
        reminder_minutes: { type: [integer, 'null'], minimum: 0, maximum: 10080 }
        recurrence:
          type: [object, 'null']
          additionalProperties: false
          required: [frequency, interval, until]
          properties:
            frequency: { type: string, enum: [daily, weekly, monthly] }
            interval: { type: integer, minimum: 1, maximum: 365 }
            until: { type: string, format: date }
    GoogleScheduleEventInput:
      type: object
      additionalProperties: false
      required: [title, all_day, time_zone]
      description: Timed events require start_at/end_at with explicit offset; all-day events require start_date/end_date with exclusive end date. Recurrence creation and reminder changes are not supported.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        all_day: { type: boolean }
        time_zone: { type: string, minLength: 1, maxLength: 100, example: Asia/Seoul }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: Exclusive end date for all-day events. }
        location: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 4000 }
      oneOf:
        - required: [start_date, end_date]
          additionalProperties: false
          properties:
            title: {}
            all_day: { const: true }
            time_zone: {}
            start_date: {}
            end_date: {}
            location: {}
            notes: {}
        - required: [start_at, end_at]
          additionalProperties: false
          properties:
            title: {}
            all_day: { const: false }
            time_zone: {}
            start_at: {}
            end_at: {}
            location: {}
            notes: {}
    WellnessEntryInput:
      type: object
      additionalProperties: false
      required: [date, mood]
      properties:
        date: { type: string, format: date }
        mood: { type: string, enum: [very_low, low, neutral, good, very_good] }
        sleep_hours: { type: [number, 'null'], minimum: 0, maximum: 24 }
        activity_minutes: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
        habits: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        note: { type: string, maxLength: 4000 }
    DiaryDraftRequest:
      type: object
      additionalProperties: false
      required: [date, allowed_source_ids]
      properties:
        date: { type: string, format: date }
        allowed_source_ids: { type: array, items: { type: string, format: uuid } }
        tone: { type: string, maxLength: 80 }
        user_notes: { type: string, maxLength: 4000 }
        privacy_consent_id: { type: string, format: uuid, description: 'Optional diary_draft consent; live calls also require both server switches, PrivacyGate, and budget.' }
    DiaryDraft:
      type: object
      additionalProperties: false
      required: [draft_id, content_version, status, content_hash]
      properties:
        draft_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, review_required, finalized] }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        body: { type: string }
        generation:
          type: object
          description: Present when external draft generation was requested; the result may be a local fallback.
          properties:
            source: { type: string, enum: [mock, gateway, local_rules] }
            fallback_used: { type: boolean }
            gate_reason: { type: [string, 'null'] }
    DiaryEntry:
      type: object
      additionalProperties: false
      required: [entry_id, date, approved_content_version, content_hash, finalized_at]
      properties:
        entry_id: { type: string, format: uuid }
        date: { type: string, format: date }
        approved_content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        finalized_at: { type: string, format: date-time }
    Sha256:
      type: string
      pattern: '^[a-fA-F0-9]{64}$'
      description: A 64-character SHA-256 hex digest; what is hashed depends on the field definition above.
