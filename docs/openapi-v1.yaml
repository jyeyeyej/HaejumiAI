openapi: 3.1.0
info:
  title: Haejumi AI API
  version: 0.5.0-draft
  description: >-
    제안/승인 대기 중인 계약 초안입니다. Creator 우선이며 개인정보 외부 전송과
    SNS/외부 발행은 서버측 동의·권리·버전 승인 검증 없이는 실행할 수 없습니다.
  x-contract-status: proposal-pending-user-approval
  x-validation-status: redocly-validated-with-warnings
  x-implementation-slice:
    status: proposed-pending-contract-approval
    notes:
      - Project creation creates an initial Creator task and a pending plan checkpoint; plan and draft continue approvals are required before render.
      - The reference adapter accepts one selected media item and one body part per upload session; each selected media item needs its own session.
      - Render jobs use only media already attached to the owned project; requests cannot provide paths or arbitrary media IDs.
      - Test renderer results use status simulated and a non-video preview media type; they are never verified MP4 output.
      - Multi-item chunk addressing, full codec decoding and final task linkage remain approval or verification items.
servers:
  - url: /api/v1
    description: Shared base path; PC browser uses a 127.0.0.1 proxy, while Android's private HTTPS route remains unverified.
tags:
  - name: Auth
  - name: Privacy
  - name: Capabilities
  - name: Assistant
  - name: Media
  - name: Projects
  - name: Tasks
  - name: Approvals
  - name: Rendering
  - name: Rights
  - name: Publishing
  - name: Diary
security:
  - bearerAuth: []
x-security-policy:
  status: proposal-pending-user-approval
  authentication: Every operation requires the authenticated session except POST /auth/session.
  ownership: >-
    Derive owner only from the authenticated principal. Check ownership of every
    referenced resource and its parent. Never accept a caller-supplied owner ID as
    authorization. Return RESOURCE_NOT_FOUND for absent or non-owned resources.
  authorization: >-
    Apply common authentication and ownership checks, then module capability scopes,
    then operation-specific consent, rights, state-transition and approval checks.
  agent_scopes:
    creator: selected media and owned content projects only; no default diary/wellness access.
    schedule: user-authorized calendar records and minimum calendar scopes only.
    wellness: user-authorized wellness records only; no cross-agent access by default.
    diary: only explicitly allowed source IDs for the requested date and purpose.
    extensions: no personal-data scopes unless separately declared and user-authorized.
x-privacy-gate:
  status: mandatory-proposal-pending-user-approval
  invariant: >-
    Every outbound request to an LLM, STT, vision, analytics or other external data
    processor MUST pass the same backend PrivacyGate/LLMGateway. Consent must be
    active and match provider, purpose, data categories, resource ownership and current
    policy at dispatch time. Missing, revoked, expired, mismatched or unverifiable
    consent MUST fail closed before network I/O; outbound request count is zero.
  no-bypass: User prompts, task creation, intermediate approvals, publish approvals and voice transcripts never grant external-processing consent.
x-external-egress-policy:
  status: proposal-pending-user-approval
  invariant: All outbound network calls are dispatched through a backend-controlled egress broker; agents and LLMs have no direct network access.
  processor-calls: Require PrivacyGate consent as defined in x-privacy-gate; absent/revoked/invalid consent means zero outbound requests.
  publication-calls: "Require the distinct Publish Gate: exact active final_publish approval, current version/hash, account/visibility/caption binding and RightsDecision=ALLOW. Missing checks mean zero platform requests."
  separation: A publish approval never authorizes processor calls; a processor consent never authorizes SNS publication.
x-content-version-policy:
  status: proposal-pending-user-approval
  content-hash: >-
    content_hash is SHA-256 of the canonical immutable version manifest: ordered source
    media IDs and source SHA-256 values, edit timeline, captions, selected music/license
    references and render settings. Exact canonical JSON rules remain approval-pending.
  artifact-hash: artifact_sha256 is SHA-256 of the exact rendered MP4 bytes.
  versioning: Any content-affecting edit creates content_version + 1 and a new content_hash.
  invalidation: >-
    A new content version invalidates all approvals bound to older versions. A change to
    publish target fields invalidates final_publish approval and requires rights recheck
    and a new final_publish approval. Old approvals are never revived by reverting edits.
x-publish-delivery-policy:
  status: proposal-pending-user-approval
  idempotency: >-
    Persist an idempotency record with owner, operation, request fingerprint and publish_id
    before dispatch. Reusing the same key and fingerprint returns the same publish_id;
    reusing the key with a different fingerprint returns 409 IDEMPOTENCY_CONFLICT.
  outbox: Persist a durable outbox item atomically with the publish job before the platform call.
  uncertain-outcome: >-
    If a request may have reached the platform but its result is unknown, set
    outcome_unknown. Do not automatically upload again. Query the official platform API
    using any available platform operation/upload ID and reconcile to succeeded, failed,
    or needs_user_action. If the platform cannot reliably query the outcome, retain the
    unknown state and request user action; never claim success or retry blindly.
  key-scope-and-retention: approval-bound semantic uniqueness and retention duration remain approval-pending.
x-capability-registry:
  status: proposal-pending-user-approval
  contract: >-
    module_id and capability_id are open string identifiers, not closed enums. Clients
    discover enabled capabilities and input_schema_version from GET /capabilities.
    The server rejects unknown or disabled identifiers with CAPABILITY_NOT_FOUND or
    CAPABILITY_DISABLED. Adding a module does not grant data scopes or change existing
    module schemas. Versioned module schemas and Registry policy are server-authoritative.
  current-mvp-agents: [creator, schedule, wellness, diary]
  future-examples: [blog, music]
paths:
  /auth/session:
    post:
      tags: [Auth]
      operationId: createSession
      security: []
      summary: Create an authenticated local session
      description: >-
        Enrollment/bootstrap method is intentionally unresolved. This operation must
        be disabled or protected by a one-time local setup mechanism until approved.
      x-approval-status: pending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: { type: string, writeOnly: true, minLength: 1 }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/processing-notice:
    get:
      tags: [Privacy]
      operationId: getOpenAIProcessingNotice
      summary: Read the provider, purpose, and data disclosure before consent
      parameters:
        - { name: provider_id, in: query, required: true, schema: { type: string, enum: [openai] } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [vision_analysis, llm_text] } }
      responses:
        '200':
          description: Server-owned disclosure shown before scoped consent
          content:
            application/json:
              schema:
                type: object
                required: [provider_id, purpose, data_categories, notice_id, notice_version, disclosure, provider_retention]
                properties:
                  provider_id: { type: string, const: openai }
                  purpose: { type: string, enum: [vision_analysis, llm_text] }
                  data_categories: { type: array, items: { type: string, enum: [selected_media, user_text] } }
                  notice_id: { type: string, format: uuid }
                  notice_version: { type: string }
                  disclosure: { type: string }
                  provider_retention: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/consents:
    get:
      tags: [Privacy]
      operationId: listPrivacyConsents
      summary: List the current user's active external-processing consents
      responses:
        '200':
          description: Active consent scopes; no consent means deny
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PrivacyConsent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Privacy]
      operationId: grantPrivacyConsent
      summary: Record explicit, scoped consent for external processing
      description: >-
        The authenticated user must confirm the displayed notice. The server accepts
        only the OpenAI provider for supported purposes and stores exact selected media IDs
        for vision consent. This action does not
        itself send data to the provider. Consent is separate from publication approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyConsentGrant' }
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyConsent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/consents/{consent_id}:
    delete:
      tags: [Privacy]
      operationId: revokePrivacyConsent
      summary: Revoke consent; queued external calls must be rechecked and blocked
      description: >-
        A queued call that has not crossed the egress boundary is cancelled. A call
        already sent cannot be recalled; its recorded status must be disclosed.
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Consent revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: List enabled, allowlisted modules and their declared scopes
      responses:
        '200':
          description: Capability registry view; does not grant access to data or tools
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /assistant/messages:
    post:
      tags: [Assistant]
      operationId: submitAssistantMessage
      summary: Submit a text request or user-confirmed transcript to Yetu
      description: >-
        Rule-based routing uses only the authenticated request and registered capabilities.
        Multiple or unknown intents return clarification. A Creator task_id permits
        planning only from media already attached to that owned task. This endpoint does
        not grant external-processing consent. OpenAI visual analysis requires a prior
        server notice display and a matching consent_id; the LLM Gateway and PrivacyGate
        revalidate it immediately before dispatch.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantMessageRequest' }
      responses:
        '202':
          description: Accepted; may create a task requiring user review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantMessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /voice/transcriptions:
    post:
      tags: [Assistant]
      operationId: transcribeVoice
      summary: Transcribe submitted audio for user review
      description: >-
        Local transcription is the proposed default. Raw audio is not retained after
        processing. Cloud STT is not selected by this endpoint; any external STT call
        must go through the external-processing consent gate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
                locale: { type: string, description: 'Optional BCP-47 locale hint; exact allowlist is pending.' }
      responses:
        '200':
          description: Transcript returned for user review; never treated as approved instruction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcript' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/plan:
    put:
      tags: [Tasks]
      operationId: updateCreatorSceneTimeline
      summary: Reorder selected media and adjust scene durations or selected video start positions
      description: Uses the current content version and hash. The media IDs must be the same owned project items exactly once; durations must sum to target_seconds. A successful edit increments the content version and invalidates affected approvals.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorSceneEditRequest' }
      responses:
        '200':
          description: Updated storyboard and pending plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Tasks]
      operationId: getCreatorPlan
      summary: Read the current owned Creator storyboard and its approval checkpoint
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Current plan and generation provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: createOrReviseCreatorPlan
      summary: Generate a structured Creator storyboard and caption draft for a current owned task
      description: Uses only media already attached to the owned project. External AI is disabled by default and local rules are the fallback. Optional privacy_consent_id permits OpenAI visual analysis only when the server flag, key, and model are configured and PrivacyGate confirms owner, provider, purpose, resource IDs, categories, and active consent immediately before dispatch. Images are locally resized and metadata-stripped; selected video frames are locally extracted. Every revision increments content_version and invalidates all earlier task approvals. This endpoint does not render or publish.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorPlanRequest' }
      responses:
        '201':
          description: Plan stored on a new content version with a pending intermediate plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Proposed policy or scope denial; the current single-owner reference adapter returns 404 for another owner's task.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/draft:
    get:
      tags: [Tasks]
      operationId: getCreatorCaptionDraft
      summary: Read captions only after the plan checkpoint has been approved
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Caption draft and its pending continue checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Tasks]
      operationId: reviseCreatorComposition
      summary: Revise captions, selected local music and audio settings
      description: Creates a new version and invalidates earlier approvals; the user must reapprove the plan and draft. Audio-only changes can reuse a previously verified video bitstream. Selected music must be an owned, uploaded library track; unverified rights permit private preview only.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorDraftEdit' }
      responses:
        '200':
          description: New version and pending plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDraftEditResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks:
    get:
      tags: [Media]
      operationId: listLocalMusicTracks
      summary: List the authenticated owner's local music registrations
      responses:
        '200':
          description: Owner-scoped music metadata and user-attested rights
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MusicTrack' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Media]
      operationId: registerLocalMusicTrack
      summary: Register a user-selected local music file and rights evidence
      description: Creates metadata only; the user must separately upload the WAV or MP3 bytes. A user rights assertion is not an independent legal verification.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MusicTrackCreate' }
      responses:
        '201':
          description: Music registration awaiting its file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks/{track_id}/content:
    put:
      tags: [Media]
      operationId: uploadLocalMusicTrack
      summary: Upload only the selected music bytes to the owner's local library
      description: Size, declared SHA-256 and WAV/MP3 signature must match. Full decoding occurs during rendering; this signature check is not malware detection.
      parameters:
        - { in: path, name: track_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded track metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks/{track_id}/rights:
    patch:
      tags: [Media, Rights]
      operationId: updateLocalMusicRights
      summary: Update user-attested rights and invalidate affected final approvals
      parameters:
        - { in: path, name: track_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rights_revision, rights]
              properties:
                rights_revision: { type: integer, minimum: 1 }
                rights: { $ref: '#/components/schemas/MusicRights' }
      responses:
        '200':
          description: Updated track and incremented rights revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Start an upload for media explicitly selected by the user
      description: >-
        Server accepts only declared upload parts. It must not enumerate or read
        other device/gallery files. Actual content type, size, digest and ownership
        are validated server-side. The current replaceable reference adapter accepts
        one selected item per session and one complete body at part_number=1. Each
        selected item is uploaded through a separate session. Multi-item sessions and
        resumable chunk semantics remain proposals pending approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadInitRequest' }
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads/{upload_id}/parts/{part_number}:
    put:
      tags: [Media]
      operationId: putUploadPart
      summary: Upload one declared part
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: part_number
          in: path
          required: true
          description: For multi-item sessions this is the 1-based item position. Single-item sessions still accept only part 1. Each file is sent in one part.
          schema: { type: integer, minimum: 1, maximum: 30 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Part accepted or identical retry acknowledged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads/{upload_id}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Verify uploaded media and finalize the selected-media import
      description: >-
        Repeating completion for the same owner and manifest returns the existing
        import/media/proposal. This operation does not create a project or task;
        project creation is a separate idempotent operation.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCompleteRequest' }
      responses:
        '200':
          description: Import finalized; proposal is deduplicated by user and manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaImport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/{media_id}:
    get:
      tags: [Media]
      operationId: getMediaMetadata
      summary: Read metadata for an owned uploaded media item
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Metadata only; private local path is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects:
    get:
      tags: [Projects]
      operationId: listContentProjects
      summary: List the authenticated owner's Creator projects
      description: Reference adapter response for the Android and localhost PC clients; no other owner's projects or local storage paths are returned.
      responses:
        '200':
          description: Owned projects, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: createContentProject
      summary: Create a Creator project from owned uploaded media
      description: >-
        This proposed initial slice also creates an idle Creator task and returns its
        task_id so the client can poll GET /tasks/{task_id}. This additive response
        field is pending API contract approval. Repeating the same owner, ordered
        media_ids and project settings returns the same project/task even with a new
        idempotency key; changing settings creates a separate project.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: Project created in a reviewable initial state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getContentProject
      summary: Read an owned project and its current version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project state and current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects/{project_id}/rights:
    get:
      tags: [Rights]
      operationId: getRightsDecision
      summary: Evaluate rights for a version and intended platform/use
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: content_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PublishPlatform' }
      responses:
        '200':
          description: Rights result; REVIEW and BLOCK are not publishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RightsDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a work item for an enabled capability
      description: >-
        Creator is the MVP priority. Schedule/Wellness/Diary may be routed only when
        enabled and authorized. Blog/Music are future capabilities and are not
        enabled merely because their identifiers appear in this schema. The module
        validates the input object against its own schema and allowed data scopes.
        Task creation does not authorize external processing or broaden data access.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '202':
          description: Task accepted; status may await user input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Read task status, progress and next user action
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task status; sensitive source text is excluded from diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/checkpoints:
    get:
      tags: [Approvals]
      operationId: listCheckpoints
      summary: List review checkpoints for an owned task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Checkpoint list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Checkpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/jobs:
    get:
      tags: [Rendering]
      operationId: listTaskRenderJobs
      summary: List an owned task's render jobs for cross-device resume
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Render jobs, newest first, without local artifact paths
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/feedback:
    post:
      tags: [Tasks]
      operationId: submitTaskFeedback
      summary: Request a revision, pause or cancel at a review checkpoint
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkpoint_id, base_content_version, content_hash, action]
              properties:
                checkpoint_id: { type: string, format: uuid }
                base_content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                action: { type: string, enum: [revise, hold, cancel] }
                comment: { type: string, maxLength: 4000 }
      responses:
        '202':
          description: Feedback accepted; affected approvals are invalidated on revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/approvals:
    post:
      tags: [Approvals]
      operationId: createApproval
      summary: Record an explicit intermediate or final approval
      description: >-
        The server MUST validate the allowed checkpoint-kind/approval-scope matrix.
        In the first Creator render slice, plan and draft checkpoints require separate continue approvals bound to the same current version/hash; only then is task status render_ready.
        This generic checkpoint route records only continue approvals for plan, draft and preview checkpoints. Platform final approvals use the separate publication-specific approval route and bind a single publication ID. No approval can authorize external processing; that uses privacy consent separately.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '201':
          description: Approval evidence recorded for the exact current artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications:
    get:
      tags: [Publishing]
      operationId: listTaskPublications
      summary: List separately stored platform posting information for an owned task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Platform-specific records; one record per platform and task
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PublicationRecord' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Publishing]
      operationId: createTaskPublication
      summary: Save posting information for one platform; does not publish
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationInput' }
      responses:
        '201':
          description: Draft metadata saved; no platform request is made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications/{publication_id}:
    get:
      tags: [Publishing]
      operationId: getTaskPublication
      summary: Read one owned platform posting record
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Exact saved platform metadata and revision state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Publishing]
      operationId: updateTaskPublication
      summary: Update one platform record and invalidate its prior final approval
      description: Requires the current revision. Any changed field increments revision, invalidates approvals attached to this publication only and returns it to draft. No posting call is made.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PublicationInput'
                - type: object
                  required: [revision]
                  properties: { revision: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Updated draft metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications/{publication_id}/approvals:
    post:
      tags: [Publishing, Approvals]
      operationId: approvePublicationTarget
      summary: Explicitly approve one exact platform publication target
      description: Requires a current ffprobe-verified real FFmpeg artifact and an approved preview. Selected music and any audible source-video audio require explicit user rights verification, commercial permission, evidence, platform permission and required attribution in the publication description. Binds task version/hash, artifact hash, publication revision/hash, platform, account, visibility and text. Approval only changes metadata state to publish_ready; no SNS API call or post is implemented. Other asset rights checks remain incomplete.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationApprovalRequest' }
      responses:
        '201':
          description: Platform-specific final approval evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/render:
    post:
      tags: [Rendering]
      operationId: renderTask
      summary: Render a specified current content version
      description: >-
        Rendering creates a private preview; it does not authorize publishing. The server requires active plan and draft continue approvals for the current version/hash and obtains inputs only from the authenticated owner's project. Test renderer results are explicitly simulated, are not MP4, and are never marked artifact_verified.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                render_profile: { type: string, enum: [vertical_9_16_h264_aac] }
                target_seconds: { type: integer, minimum: 3, maximum: 59, default: 30, description: Final output must remain shorter than 60 seconds. }
                framing: { type: string, enum: [fit_pad, fill_crop], default: fit_pad, description: fit_pad preserves the full source frame; fill_crop uses the supplied focal point. }
                focal_x: { type: number, minimum: 0, maximum: 1, default: 0.5 }
                focal_y: { type: number, minimum: 0, maximum: 1, default: 0.5 }
      responses:
        '202':
          description: Render job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}:
    get:
      tags: [Rendering]
      operationId: getJob
      summary: Poll an owned render or processing job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state and safe progress details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/preview:
    get:
      tags: [Rendering]
      operationId: getTaskPreview
      summary: Retrieve a private preview for an owned task/version
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: content_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Private MP4 preview
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            video/mp4:
              schema: { type: string, format: binary }
            application/x-haejumi-test-preview:
              schema: { type: string, format: binary, description: Test renderer marker bytes only; never a video. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}/cancel:
    post:
      tags: [Rendering]
      operationId: cancelJob
      summary: Cancel an owned queued or running render job
      description: Cancellation is best effort once FFmpeg is running; a cancelled job cannot publish or expose a verified preview.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Current job state after cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /publishes:
    post:
      tags: [Publishing]
      operationId: createPublish
      summary: Request publication of one exactly approved artifact
      description: >-
        Server MUST fail closed unless the authenticated owner, final_publish approval,
        current content version/hash and artifact SHA-256, platform/account/visibility/
        caption binding, rights=ALLOW, account authorization and idempotency record all
        match. Persist the idempotency record and durable outbox job before dispatch.
        Intermediate approval, voice transcript, or external-processing consent is not
        publication approval. If external outcome is uncertain, set outcome_unknown,
        do not upload again, and reconcile through the official platform API before
        marking success/failure. Never blind-retry an uncertain publication.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '202':
          description: New publication accepted after all server-side gates pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '200':
          description: Same idempotency key and request fingerprint; returns the existing publish job without dispatching a second publication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /publishes/{publish_id}:
    get:
      tags: [Publishing]
      operationId: getPublish
      summary: Read publication status without triggering another publish
      parameters:
        - $ref: '#/components/parameters/PublishId'
      responses:
        '200':
          description: Publish status; mock and real outcomes are distinguished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts:
    post:
      tags: [Diary]
      operationId: createDiaryDraft
      summary: Create a draft from explicitly allowed source records
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryDraftRequest' }
      responses:
        '202':
          description: Draft generation accepted; not a finalized diary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts/{draft_id}:
    patch:
      tags: [Diary]
      operationId: reviseDiaryDraft
      summary: Revise an owned draft and advance its version
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_content_version, feedback]
              properties:
                base_content_version: { type: integer, minimum: 1 }
                feedback: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: New draft version; prior final approval is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /diaries/drafts/{draft_id}/finalize:
    post:
      tags: [Diary]
      operationId: finalizeDiaryDraft
      summary: Save only the exactly approved current diary version
      description: >-
        The approval_id must refer to active approval_scope=final_diary for this exact
        draft, content_version and content_hash. Any other approval scope is rejected.
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash, approval_id]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                approval_id: { type: string, format: uuid }
      responses:
        '201':
          description: Final diary entry created after server checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: Proposed transport; token issuance and storage remain to be approved.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per operation attempt; scope and retention are approval items.
      schema: { type: string, minLength: 16, maxLength: 200 }
    ConsentId: { name: consent_id, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: upload_id, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: media_id, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
    PublicationId: { name: publication_id, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
    PublishId: { name: publish_id, in: path, required: true, schema: { type: string, format: uuid } }
    DraftId: { name: draft_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized:
      description: Missing, invalid or expired authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated but policy, scope, rights or approval gate denied the action
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource absent or not visible to this owner
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Stale version/approval, invalid state transition or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ValidationError:
      description: Request does not satisfy schema or policy input constraints
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    PayloadTooLarge:
      description: Upload exceeds configured limit
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    UnsupportedMedia:
      description: Declared or detected media type is not accepted
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Rate limit reached
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unavailable:
      description: Required local worker or approved integration is unavailable; no publish is claimed
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error:
      description: Unexpected safe error; sensitive source text, tokens and private paths are excluded
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field: { type: string }
                  reason: { type: string }
        request_id: { type: string, format: uuid }
    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, AUTHENTICATION_REQUIRED, FORBIDDEN, RESOURCE_NOT_FOUND, CAPABILITY_NOT_FOUND, CAPABILITY_DISABLED, CONSENT_REQUIRED, PRIVACY_POLICY_DENIED, RIGHTS_BLOCKED, RIGHTS_REVIEW_REQUIRED, VERSION_CONFLICT, STALE_APPROVAL, APPROVAL_SCOPE_MISMATCH, INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, PUBLICATION_ALREADY_EXISTS, PUBLISH_ALREADY_EXISTS, PLATFORM_NOT_SUPPORTED, OAUTH_EXPIRED, RENDER_REQUIRED, RENDER_FAILED, LLM_BUDGET_EXCEEDED, TRANSCRIPT_CONFIRMATION_REQUIRED, RATE_LIMITED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, SERVICE_UNAVAILABLE]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at]
      properties:
        access_token: { type: string, writeOnly: true }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
    PrivacyPurpose:
      type: string
      enum: [llm_text, vision_analysis]
    PrivacyConsentGrant:
      type: object
      additionalProperties: false
      required: [provider_id, purpose, data_categories, notice_id, notice_version, explicitly_confirmed, expires_at]
      allOf:
        - if: { properties: { purpose: { const: vision_analysis } }, required: [purpose] }
          then:
            required: [resource_ids]
            properties:
              resource_ids: { minItems: 1 }
              data_categories:
                minItems: 2
                maxItems: 2
                allOf:
                  - contains: { const: selected_media }
                  - contains: { const: user_text }
        - if: { properties: { purpose: { const: llm_text } }, required: [purpose] }
          then: { properties: { data_categories: { const: [user_text] } } }
      properties:
        provider_id: { type: string, const: openai }
        purpose: { $ref: '#/components/schemas/PrivacyPurpose' }
        data_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [selected_media, transcript, user_text, schedule, diary, wellness] }
        resource_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: For vision_analysis, the exact selected media IDs must be non-empty and owner-authorized.
        notice_version: { type: string }
        notice_id: { type: string, format: uuid }
        explicitly_confirmed: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
    PrivacyConsent:
      type: object
      additionalProperties: false
      required: [consent_id, provider_id, purpose, data_categories, resource_ids, notice_id, notice_version, explicitly_confirmed, expires_at, status, created_at]
      properties:
        consent_id: { type: string, format: uuid }
        provider_id: { type: string, const: openai }
        purpose: { $ref: '#/components/schemas/PrivacyPurpose' }
        data_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [selected_media, transcript, user_text, schedule, diary, wellness] }
        resource_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        notice_version: { type: string }
        notice_id: { type: string, format: uuid }
        explicitly_confirmed: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked, expired] }
        created_at: { type: string, format: date-time }
    Capability:
      type: object
      additionalProperties: false
      required: [module_id, module_version, status, capability_ids, scopes, input_schema_version]
      properties:
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        agent_name: { type: string }
        module_version: { type: string }
        status: { type: string, enum: [enabled, disabled, planned] }
        implementation_status: { type: string, enum: [implemented, registered, extension_placeholder] }
        capability_ids: { type: array, items: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' } }
        scopes: { type: array, items: { type: string } }
        input_schema_version: { type: string }
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 12000 }
        input_kind: { type: string, enum: [typed_text, confirmed_transcript] }
        confirmed_transcript: { type: boolean, default: false }
        attachment_ids: { type: array, items: { type: string, format: uuid } }
        task_id: { type: string, format: uuid, description: Existing owned Creator task; required to create a storyboard from its selected project media. }
        privacy_consent_id: { type: string, format: uuid, description: Optional active OpenAI vision consent; does not enable external calls by itself. }
    AssistantMessageResponse:
      type: object
      additionalProperties: false
      required: [reply, route, status]
      properties:
        reply: { type: string }
        route: { type: string }
        status: { type: string, enum: [routed, needs_project, needs_clarification, not_implemented, disabled, unsupported] }
        agent_id: { type: [string, 'null'] }
        capability_id: { type: [string, 'null'] }
        task_id: { type: [string, 'null'], format: uuid }
        content_version: { type: [integer, 'null'], minimum: 1 }
        content_hash: { allOf: [{ $ref: '#/components/schemas/Sha256' }], type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/CreatorStoryboard' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        generation: { $ref: '#/components/schemas/GenerationMetadata' }
    CreatorPlanRequest:
      type: object
      additionalProperties: false
      required: [content_version, request_text]
      properties:
        content_version: { type: integer, minimum: 1, description: Current task version used as the concurrency precondition; stale versions on new requests are rejected with 409. An identical idempotent replay returns its recorded result. }
        request_text: { type: string, minLength: 1, maxLength: 4000 }
        privacy_consent_id: { type: string, format: uuid, description: Optional owner-bound consent for OpenAI vision analysis. }
    CreatorSceneEditRequest:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, scenes]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        scenes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [media_id, duration_seconds]
            properties:
              media_id: { type: string, format: uuid }
              duration_seconds: { type: number, minimum: 0.1, maximum: 59 }
              trim_start_seconds: { type: number, minimum: 0, maximum: 3600, description: Video only; seek from this source position before rendering. }
    CreatorPlanResult:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, plan, checkpoint, generation]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        plan: { $ref: '#/components/schemas/CreatorStoryboard' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        generation: { $ref: '#/components/schemas/GenerationMetadata' }
    CreatorStoryboard:
      type: object
      additionalProperties: false
      required: [title_idea, format, aspect_ratio, target_seconds, scenes]
      properties:
        title_idea: { type: string, maxLength: 64 }
        format: { type: string, const: vertical_short }
        aspect_ratio: { type: string, const: '9:16' }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        scenes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order, media_id, media_type, start_seconds, end_seconds, visual_direction, caption_text]
            properties:
              order: { type: integer, minimum: 1 }
              media_id: { type: string, format: uuid }
              media_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime] }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59 }
              trim_start_seconds: { type: number, minimum: 0, maximum: 3600 }
              visual_direction: { type: string, maxLength: 500 }
              caption_text: { type: string, maxLength: 500 }
    CreatorDraft:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, captions, composition, checkpoint]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        captions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order, start_seconds, end_seconds, text]
            properties:
              order: { type: integer, minimum: 1 }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59 }
              text: { type: string, maxLength: 500 }
        composition:
          anyOf:
            - { $ref: '#/components/schemas/CreatorComposition' }
            - { type: 'null' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
    CreatorComposition:
      type: object
      additionalProperties: false
      required: [captions_enabled, music_track_id, source_volume, music_volume, fade_in_seconds, fade_out_seconds]
      properties:
        captions_enabled: { type: boolean }
        music_track_id: { type: [string, 'null'], format: uuid }
        source_volume: { type: number, minimum: 0, maximum: 2 }
        music_volume: { type: number, minimum: 0, maximum: 2 }
        fade_in_seconds: { type: number, minimum: 0, maximum: 10, description: Must not exceed half the project duration. }
        fade_out_seconds: { type: number, minimum: 0, maximum: 10, description: Must not exceed half the project duration. }
        source_audio_rights: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/SourceAudioRight' } }
    CreatorDraftEdit:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, captions, captions_enabled, music_track_id, source_volume, music_volume, fade_in_seconds, fade_out_seconds]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        captions:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [order, start_seconds, end_seconds, text]
            properties:
              order: { type: integer, minimum: 1, description: Must match its one-based array position. }
              start_seconds: { type: number, minimum: 0 }
              end_seconds: { type: number, exclusiveMinimum: 0, maximum: 59, description: Must be after start and at most the project duration. }
              text: { type: string, maxLength: 80, description: 'Korean, supported ASCII and selected punctuation; control characters and unsupported glyphs are rejected.' }
        captions_enabled: { type: boolean }
        music_track_id: { type: [string, 'null'], format: uuid }
        source_volume: { type: number, minimum: 0, maximum: 2 }
        music_volume: { type: number, minimum: 0, maximum: 2 }
        fade_in_seconds: { type: number, minimum: 0, maximum: 10 }
        fade_out_seconds: { type: number, minimum: 0, maximum: 10 }
        source_audio_rights: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/SourceAudioRight' }, description: Optional per-video rights assertions; omitted preserves existing assertions. }
    SourceAudioRight:
      type: object
      additionalProperties: false
      required: [media_id, explicitly_verified, commercial_allowed, platforms, evidence, attribution_required, required_attribution]
      description: User-attested rights for source video audio; the media ID must belong to the project. Audible source audio without valid platform-specific rights blocks final approval.
      properties:
        media_id: { type: string, format: uuid }
        explicitly_verified: { type: boolean }
        commercial_allowed: { type: boolean }
        platforms: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/PublishPlatform' } }
        evidence: { type: string, maxLength: 4000 }
        attribution_required: { type: boolean }
        required_attribution: { type: string, maxLength: 2000 }
    CreatorDraftEditResult:
      type: object
      additionalProperties: false
      required: [task_id, content_version, content_hash, checkpoint]
      properties:
        task_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
    MusicRights:
      type: object
      additionalProperties: false
      required: [source_url, license_name, license_version, license_url, evidence, downloaded_at, attribution_required, required_attribution, commercial_allowed, platforms, explicitly_verified]
      description: User-attested evidence; explicit verification requires nonempty source, license name/version/URL, evidence, download date, commercial permission and at least one permitted platform. Attribution, when required, must appear in the publication description.
      properties:
        source_url: { type: string, maxLength: 2000 }
        license_name: { type: string, maxLength: 300 }
        license_version: { type: string, maxLength: 200 }
        license_url: { type: string, maxLength: 2000 }
        evidence: { type: string, maxLength: 4000 }
        downloaded_at: { type: string, description: YYYY-MM-DD or empty while unverified. }
        attribution_required: { type: boolean }
        required_attribution: { type: string, maxLength: 2000 }
        commercial_allowed: { type: boolean }
        platforms: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/PublishPlatform' } }
        explicitly_verified: { type: boolean }
    MusicTrackCreate:
      type: object
      additionalProperties: false
      required: [title, artist, format, size_bytes, sha256, rights]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        artist: { type: string, minLength: 1, maxLength: 200 }
        format: { type: string, enum: [wav, mp3] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        rights: { $ref: '#/components/schemas/MusicRights' }
    MusicTrack:
      type: object
      additionalProperties: false
      required: [track_id, title, artist, format, size_bytes, sha256, rights, rights_revision, rights_status, status]
      properties:
        track_id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string }
        format: { type: string, enum: [wav, mp3] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        rights: { $ref: '#/components/schemas/MusicRights' }
        rights_revision: { type: integer, minimum: 1 }
        rights_status: { type: string, enum: [unverified, user_verified] }
        status: { type: string, enum: [awaiting_upload, available] }
    GenerationMetadata:
      type: object
      additionalProperties: false
      required: [source, fallback_used, llm_calls, estimated_cost_usd, gate_reason]
      properties:
        source: { type: string, enum: [mock, gateway, local_rules] }
        fallback_used: { type: boolean }
        llm_calls: { type: integer, minimum: 0 }
        estimated_cost_usd: { type: number, minimum: 0 }
        gate_reason: { type: [string, 'null'] }
    Transcript:
      type: object
      additionalProperties: false
      required: [transcript_id, text, confirmed, audio_retained]
      properties:
        transcript_id: { type: string, format: uuid }
        text: { type: string }
        confirmed: { type: boolean, const: false }
        audio_retained: { type: boolean, const: false }
    UploadInitRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        project_id: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [client_item_id, file_name, declared_media_type, size_bytes, sha256]
            properties:
              client_item_id: { type: string, format: uuid }
              file_name: { type: string, minLength: 1, maxLength: 255 }
              declared_media_type: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime] }
              size_bytes: { type: integer, minimum: 1 }
              sha256: { $ref: '#/components/schemas/Sha256' }
    UploadSession:
      type: object
      additionalProperties: false
      required: [upload_id, status, expires_at, accepted_items]
      properties:
        upload_id: { type: string, format: uuid }
        status: { type: string, enum: [created, uploading, completed, rejected, expired] }
        expires_at: { type: string, format: date-time }
        accepted_items:
          type: array
          items:
            type: object
            required: [client_item_id, received_parts]
            properties:
              client_item_id: { type: string, format: uuid }
              received_parts: { type: array, items: { type: integer, minimum: 1 } }
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      description: >-
        The adapter hashes UTF-8 bytes of compact JSON for an ordered array with
        each object in this field order: client_item_id (lowercase UUID),
        sha256 (lowercase hex) and size_bytes (integer). This canonicalization is
        provisional and remains pending API approval. For multi-item sessions items
        is required and must match the upload session exactly. Single-item sessions
        may omit items for backward compatibility.
      required: [manifest_sha256]
      properties:
        manifest_sha256: { allOf: [{ $ref: '#/components/schemas/Sha256' }], description: SHA-256 of the provisional canonical manifest described above. }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [client_item_id, sha256, size_bytes]
            properties:
              client_item_id: { type: string, format: uuid }
              sha256: { $ref: '#/components/schemas/Sha256' }
              size_bytes: { type: integer, minimum: 1 }
    MediaImport:
      type: object
      additionalProperties: false
      required: [import_id, status, media, manifest_sha256, proposal]
      properties:
        import_id: { type: string, format: uuid }
        status: { type: string, enum: [completed, rejected] }
        manifest_sha256: { $ref: '#/components/schemas/Sha256' }
        media: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }
        proposal:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [created, already_created, suppressed] }
            proposal_id: { type: string, format: uuid }
    MediaAsset:
      type: object
      additionalProperties: false
      required: [media_id, media_type, media_type_verified, size_bytes, sha256, status]
      properties:
        media_id: { type: string, format: uuid }
        media_type: { type: string }
        media_type_verified: { type: boolean, description: Signature and container-structure checks passed; this does not assert full codec decoding. }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        status: { type: string, enum: [available, quarantined, deleted] }
        captured_at: { type: string, format: date-time }
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [media_ids]
      properties:
        media_ids: { type: array, minItems: 1, maxItems: 30, uniqueItems: true, items: { type: string, format: uuid }, description: Default server limit is 20; configurable up to 30. }
        style: { type: string, maxLength: 80 }
        target_seconds: { type: integer, minimum: 3, maximum: 59, default: 30, description: Desired video duration in seconds; accepted range is 3 through 59 (60 is excluded). }
        aspect_ratio: { type: string, const: '9:16' }
        framing: { type: string, enum: [fit_pad, fill_crop], default: fit_pad }
        focal_x: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        focal_y: { type: number, minimum: 0, maximum: 1, default: 0.5 }
    ContentProject:
      type: object
      additionalProperties: false
      required: [project_id, task_id, status, current_version, media_ids]
      properties:
        project_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: Proposed initial task created with this project; approval pending. }
        status: { type: string, enum: [created, planning, review_required, rendering, ready, blocked, failed] }
        current_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        media_ids: { type: array, items: { type: string, format: uuid } }
        media_manifest:
          type: array
          description: Server-verified selected media in project order. Older projects may omit this field.
          items:
            type: object
            additionalProperties: false
            required: [order, media_id, sha256]
            properties:
              order: { type: integer, minimum: 1 }
              media_id: { type: string, format: uuid }
              sha256: { $ref: '#/components/schemas/Sha256' }
        style: { type: string, maxLength: 80 }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        aspect_ratio: { type: string, const: '9:16' }
        framing: { type: string, enum: [fit_pad, fill_crop] }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
    TaskCreateRequest:
      type: object
      additionalProperties: false
      description: The Registry validates module_id, capability_id and input_schema_version before accepting input.
      required: [module_id, capability_id, input_schema_version, input]
      properties:
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        capability_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        input_schema_version: { type: string, minLength: 1, maxLength: 64 }
        project_id: { type: string, format: uuid }
        confirmed_transcript: { type: boolean, default: false }
        input: { type: object, additionalProperties: true }
    Task:
      type: object
      additionalProperties: false
      required: [task_id, module_id, capability_id, status, current_version, created_at]
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        module_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        capability_id: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
        status:
          type: string
          enum: [created, planning, waiting_plan_approval, drafting, waiting_draft_approval, render_ready, revising, rendering, render_simulated, waiting_preview_approval, preview_approved, waiting_final_publish_approval, waiting_final_diary_approval, ready_to_publish, publish_queued, publishing, outcome_unknown, reconciling, needs_user_action, published, saved, on_hold, cancelled, failed, rights_blocked, stale_approval]
        current_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        next_action: { type: string, enum: [review_plan, review_draft, review_preview, final_approval, none] }
        active_job_id: { type: string, format: uuid }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Checkpoint:
      type: object
      additionalProperties: false
      description: >-
        Current Creator implementation uses plan/draft/preview + continue. Platform final
        publication approvals are stored on publication resources; final_diary remains a
        future Diary capability and cannot be accepted by the generic Creator endpoint.
      required: [checkpoint_id, kind, status, content_version, content_hash, approval_scope]
      properties:
        checkpoint_id: { type: string, format: uuid }
        kind: { type: string, enum: [plan, draft, preview, final_publish, final_diary] }
        status: { type: string, enum: [pending, approved, revision_requested, on_hold, cancelled, invalidated] }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, enum: [continue, final_publish, final_diary] }
        summary: { type: string, maxLength: 500 }
        approval_id: { type: string, format: uuid }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [checkpoint_id, content_version, content_hash, approval_scope]
      properties:
        checkpoint_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, const: continue }
    Approval:
      type: object
      additionalProperties: false
      description: >-
        content_hash binds the canonical content version; approval_hash binds scope,
        checkpoint, version/hash and, for final_publish, artifact_sha256 and publish_target.
      required: [approval_id, task_id, checkpoint_id, content_version, content_hash, approval_hash, approval_scope, status, approved_at]
      properties:
        approval_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        checkpoint_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { type: string, enum: [continue, final_publish, final_diary] }
        status: { type: string, enum: [active, invalidated, consumed] }
        publish_target: { $ref: '#/components/schemas/PublishTarget' }
        approved_at: { type: string, format: date-time }
    Job:
      type: object
      additionalProperties: false
      required: [job_id, task_id, kind, status, progress_percent]
      properties:
        job_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind: { type: string, enum: [render, transcription, external_processing] }
        status: { type: string, enum: [queued, running, succeeded, simulated, failed, cancelled, blocked, outcome_unknown, reconciling, needs_user_action] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        safe_error_code: { type: string }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        renderer_mode: { type: string, enum: [ffmpeg, test] }
        video_reused: { type: boolean, description: Previously verified video stream was reused for an audio-only change. }
        source_audio_media_ids: { type: array, items: { type: string, format: uuid }, description: Source video IDs for which ffprobe detected an audio stream. }
        artifact_verified: { type: boolean }
        preview_ready: { type: boolean }
        render_profile: { type: string, enum: [vertical_9_16_h264_aac] }
        target_seconds: { type: integer, minimum: 3, maximum: 59 }
        framing: { type: string, enum: [fit_pad, fill_crop] }
        focal_x: { type: number, minimum: 0, maximum: 1 }
        focal_y: { type: number, minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    PublishPlatform:
      type: string
      enum: [youtube, instagram, tiktok]
    PublicationInput:
      type: object
      additionalProperties: false
      required: [platform, account_id, visibility, title, description, hashtags]
      properties:
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, minLength: 1, maxLength: 128, description: Opaque platform account identifier; never an access token. }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        hashtags: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 100 } }
    PublicationRecord:
      allOf:
        - $ref: '#/components/schemas/PublicationInput'
        - type: object
          required: [publication_id, task_id, revision, metadata_hash, status, created_at, updated_at]
          properties:
            publication_id: { type: string, format: uuid }
            task_id: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            metadata_hash: { $ref: '#/components/schemas/Sha256' }
            status: { type: string, enum: [draft, publish_ready] }
            approval_id: { type: [string, 'null'], format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PublicationApprovalRequest:
      type: object
      additionalProperties: false
      required: [content_version, content_hash, artifact_sha256, publication_revision, publication_hash]
      properties:
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        publication_revision: { type: integer, minimum: 1 }
        publication_hash: { $ref: '#/components/schemas/Sha256' }
    PublicationApproval:
      type: object
      additionalProperties: false
      required: [approval_id, task_id, publication_id, platform, account_id, visibility, title, description, hashtags, content_version, content_hash, artifact_sha256, publication_revision, publication_hash, approval_scope, approval_hash, status, approved_at]
      properties:
        approval_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        publication_id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, minLength: 1, maxLength: 128 }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        hashtags: { type: array, maxItems: 30, items: { type: string } }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        publication_revision: { type: integer, minimum: 1 }
        publication_hash: { $ref: '#/components/schemas/Sha256' }
        approval_scope: { const: final_publish }
        approval_hash: { $ref: '#/components/schemas/Sha256' }
        status: { type: string, enum: [active, invalidated] }
        approved_at: { type: string, format: date-time }
    PublishTarget:
      type: object
      additionalProperties: false
      required: [platform, account_id, visibility, caption]
      properties:
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        caption: { type: string, maxLength: 5000 }
    RightsDecision:
      type: object
      additionalProperties: false
      required: [decision, content_version, content_hash, platform, checked_at, reasons]
      properties:
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        checked_at: { type: string, format: date-time }
        reasons: { type: array, items: { type: string } }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [task_id, project_id, content_version, content_hash, artifact_sha256, approval_id, platform, account_id, visibility, caption]
      properties:
        task_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        account_id: { type: string, format: uuid }
        visibility: { type: string, enum: [private, unlisted, public, followers] }
        caption: { type: string, maxLength: 5000 }
    PublishJob:
      type: object
      additionalProperties: false
      required: [publish_id, status, mode, platform, content_version, content_hash, artifact_sha256, approval_id]
      properties:
        publish_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, uploading, outcome_unknown, reconciling, succeeded, failed, blocked, needs_user_action] }
        mode: { type: string, enum: [mock, real] }
        platform: { $ref: '#/components/schemas/PublishPlatform' }
        content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        artifact_sha256: { $ref: '#/components/schemas/Sha256' }
        approval_id: { type: string, format: uuid }
        external_id: { type: string }
        url: { type: string, format: uri }
        safe_error_code: { type: string }
        reconciliation_status: { type: string, enum: [not_needed, pending, querying_platform, matched_success, matched_failure, inconclusive, user_action_required] }
        platform_operation_id: { type: string }
        next_retry_at: { type: string, format: date-time, description: 'Only for safe reconciliation queries; never signals blind re-upload.' }
    DiaryDraftRequest:
      type: object
      additionalProperties: false
      required: [date, allowed_source_ids]
      properties:
        date: { type: string, format: date }
        allowed_source_ids: { type: array, items: { type: string, format: uuid } }
        tone: { type: string, maxLength: 80 }
    DiaryDraft:
      type: object
      additionalProperties: false
      required: [draft_id, content_version, status, content_hash]
      properties:
        draft_id: { type: string, format: uuid }
        content_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, review_required, finalized] }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        body: { type: string }
    DiaryEntry:
      type: object
      additionalProperties: false
      required: [entry_id, date, approved_content_version, content_hash, finalized_at]
      properties:
        entry_id: { type: string, format: uuid }
        date: { type: string, format: date }
        approved_content_version: { type: integer, minimum: 1 }
        content_hash: { $ref: '#/components/schemas/Sha256' }
        finalized_at: { type: string, format: date-time }
    Sha256:
      type: string
      pattern: '^[a-fA-F0-9]{64}$'
      description: A 64-character SHA-256 hex digest; what is hashed depends on the field definition above.
