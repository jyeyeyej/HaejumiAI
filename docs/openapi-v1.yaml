openapi: 3.1.0
info:
  title: Haejumi AI API
  version: 0.5.0-draft
  description: >-
    제안/승인 대기 중인 계약 초안입니다. Creator 우선이며 개인정보 외부 전송과
    SNS/외부 발행은 서버측 동의·권리·버전 승인 검증 없이는 실행할 수 없습니다.
  x-contract-status: proposal-pending-user-approval
  x-validation-status: redocly-validated-with-warnings
  x-implementation-slice:
    status: proposed-pending-contract-approval
    notes:
      - Project creation creates an initial Creator task and a pending plan checkpoint; plan and draft continue approvals are required before render.
      - The reference adapter supports ordered multi-item upload sessions; each selected media item currently uses one numbered body part.
      - Render jobs use only media already attached to the owned project; requests cannot provide paths or arbitrary media IDs.
      - Test renderer results use status simulated and a non-video preview media type; they are never verified MP4 output.
      - Actual Android device use, private HTTPS routing, and external provider dispatch remain unverified.
servers:
  - url: /api/v1
    description: Shared base path; PC browser uses a 127.0.0.1 proxy, while Android's private HTTPS route remains unverified.
tags:
  - name: Auth
  - name: Privacy
  - name: Capabilities
  - name: Assistant
  - name: Media
  - name: Projects
  - name: Tasks
  - name: Approvals
  - name: Rendering
  - name: Rights
  - name: Publishing
  - name: Diary
  - name: Backups
  - name: Trends
security:
  - bearerAuth: []
  - webSession: []
x-security-policy:
  status: proposal-pending-user-approval
  authentication: Every operation requires the authenticated session except POST /auth/session.
  ownership: >-
    Derive owner only from the authenticated principal. Check ownership of every
    referenced resource and its parent. Never accept a caller-supplied owner ID as
    authorization. Return RESOURCE_NOT_FOUND for absent or non-owned resources.
  authorization: >-
    Apply common authentication and ownership checks, then module capability scopes,
    then operation-specific consent, rights, state-transition and approval checks.
  agent_scopes:
    creator: selected media and owned content projects only; no default diary/wellness access.
    schedule: user-authorized calendar records and minimum calendar scopes only.
    wellness: user-authorized wellness records only; no cross-agent access by default.
    diary: only explicitly allowed source IDs for the requested date and purpose.
    extensions: no personal-data scopes unless separately declared and user-authorized.
x-privacy-gate:
  status: mandatory-proposal-pending-user-approval
  invariant: >-
    Every outbound request to an LLM, STT, vision, analytics or other external data
    processor MUST pass the same backend PrivacyGate/LLMGateway. Consent must be
    active and match provider, purpose, data categories, resource ownership and current
    policy at dispatch time. Missing, revoked, expired, mismatched or unverifiable
    consent MUST fail closed before network I/O; outbound request count is zero.
  no-bypass: User prompts, task creation, intermediate approvals, publish approvals and voice transcripts never grant external-processing consent.
x-external-egress-policy:
  status: proposal-pending-user-approval
  invariant: All outbound network calls are dispatched through a backend-controlled egress broker; agents and LLMs have no direct network access.
  processor-calls: Require PrivacyGate consent as defined in x-privacy-gate; absent/revoked/invalid consent means zero outbound requests.
  publication-calls: "Require the distinct Publish Gate: exact active final_publish approval, current version/hash, account/visibility/caption binding and RightsDecision=ALLOW. Missing checks mean zero platform requests."
  separation: A publish approval never authorizes processor calls; a processor consent never authorizes SNS publication.
x-content-version-policy:
  status: proposal-pending-user-approval
  content-hash: >-
    content_hash is SHA-256 of the canonical immutable version manifest: ordered source
    media IDs and source SHA-256 values, edit timeline, captions, selected music/license
    references and render settings. Exact canonical JSON rules remain approval-pending.
  artifact-hash: artifact_sha256 is SHA-256 of the exact rendered MP4 bytes.
  versioning: Any content-affecting edit creates content_version + 1 and a new content_hash.
  invalidation: >-
    A new content version invalidates all approvals bound to older versions. A change to
    publish target fields invalidates final_publish approval and requires rights recheck
    and a new final_publish approval. Old approvals are never revived by reverting edits.
x-publish-delivery-policy:
  status: proposal-pending-user-approval
  idempotency: >-
    Persist an idempotency record with owner, operation, request fingerprint and publish_id
    before dispatch. Reusing the same key and fingerprint returns the same publish_id;
    reusing the key with a different fingerprint returns 409 IDEMPOTENCY_CONFLICT.
  outbox: Persist a durable outbox item atomically with the publish job before the platform call.
  uncertain-outcome: >-
    If a request may have reached the platform but its result is unknown, set
    outcome_unknown. Do not automatically upload again. Query the official platform API
    using any available platform operation/upload ID and reconcile to succeeded, failed,
    or needs_user_action. If the platform cannot reliably query the outcome, retain the
    unknown state and request user action; never claim success or retry blindly.
  key-scope-and-retention: approval-bound semantic uniqueness and retention duration remain approval-pending.
x-capability-registry:
  status: proposal-pending-user-approval
  contract: >-
    module_id and capability_id are open string identifiers, not closed enums. Clients
    discover enabled capabilities and input_schema_version from GET /capabilities.
    The server rejects unknown or disabled identifiers with CAPABILITY_NOT_FOUND or
    CAPABILITY_DISABLED. Adding a module does not grant data scopes or change existing
    module schemas. Versioned module schemas and Registry policy are server-authoritative.
  current-mvp-agents: [creator, schedule, wellness, diary]
  future-examples: [blog, music]
paths:
  /auth/web-session:
    post:
      tags: [Auth]
      operationId: createLocalWebSession
      summary: Exchange a valid local Bearer token for a persistent PC web session
      security: [{ bearerAuth: [] }]
      description: Requires same-origin 127.0.0.1 Origin and X-Haejumi-Web header. Sets a 30-day HttpOnly SameSite=Strict cookie containing only a random session ID. Local HTTP omits Secure; a verified private HTTPS endpoint must enable Secure.
      parameters:
        - { name: X-Haejumi-Web, in: header, required: true, schema: { type: string, enum: ['1'] } }
      responses:
        '201': { description: Session cookie issued }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Auth]
      operationId: getLocalWebSession
      summary: Check the current web login without exposing the session ID
      responses:
        '200': { description: Valid login session }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      operationId: revokeLocalWebSession
      summary: Revoke the current web login and clear its cookie
      security: [{ webSession: [] }]
      parameters:
        - { name: X-Haejumi-Web, in: header, required: true, schema: { type: string, enum: ['1'] } }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /llm/usage:
    get:
      tags: [Privacy]
      operationId: getLlmUsage
      summary: Read local LLM enablement and reserved budget without revealing credentials
      responses:
        '200':
          description: Local LLM usage and configured limits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, provider_ready, availability_reason, day, month, daily_reserved_usd, monthly_reserved_usd, daily_limit_usd, monthly_limit_usd, max_calls_per_task]
                properties:
                  enabled: { type: boolean }
                  provider_ready: { type: boolean }
                  availability_reason: { type: string, enum: [READY, LLM_SWITCH_OFF, LIVE_SWITCH_OFF, PROVIDER_CONFIG_MISSING, UNAVAILABLE] }
                  day: { type: [string, 'null'] }
                  month: { type: [string, 'null'] }
                  daily_reserved_usd: { type: number, minimum: 0 }
                  monthly_reserved_usd: { type: number, minimum: 0 }
                  daily_limit_usd: { type: number, minimum: 0 }
                  monthly_limit_usd: { type: number, minimum: 0 }
                  max_calls_per_task: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    post:
      tags: [Auth]
      operationId: createSession
      security: []
      summary: Create an authenticated local session
      description: >-
        Enrollment/bootstrap method is intentionally unresolved. This operation must
        be disabled or protected by a one-time local setup mechanism until approved.
      x-approval-status: pending
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: { type: string, writeOnly: true, minLength: 1 }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /backups:
    post:
      tags: [Backups]
      operationId: createLocalBackup
      summary: Create an owner-bound local snapshot with file hashes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Snapshot created without modifying live data
          content:
            application/json:
              schema:
                type: object
                required: [backup_id, created_at, file_count, status]
                properties:
                  backup_id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
                  file_count: { type: integer, minimum: 1 }
                  status: { type: string, const: verified_snapshot }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /backups/{backup_id}/restore-copy:
    post:
      tags: [Backups]
      operationId: restoreLocalBackupCopy
      summary: Verify a snapshot and materialize a separate recovered copy
      description: Does not replace or activate live state. Requires an authenticated owner and a matching backup owner.
      parameters:
        - { name: backup_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Verified copy created; live data untouched
          content:
            application/json:
              schema:
                type: object
                required: [restore_id, backup_id, file_count, status, notice]
                properties:
                  restore_id: { type: string, format: uuid }
                  backup_id: { type: string, format: uuid }
                  file_count: { type: integer, minimum: 1 }
                  status: { type: string, const: recovered_copy }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/processing-notice:
    get:
      tags: [Privacy]
      operationId: getOpenAIProcessingNotice
      summary: Read the provider, purpose, and data disclosure before consent
      parameters:
        - { name: provider_id, in: query, required: true, schema: { type: string, enum: [openai] } }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [vision_analysis, llm_text, diary_draft] } }
      responses:
        '200':
          description: Server-owned disclosure shown before scoped consent
          content:
            application/json:
              schema:
                type: object
                required: [provider_id, purpose, data_categories, notice_id, notice_version, disclosure, provider_retention]
                properties:
                  provider_id: { type: string, const: openai }
                  purpose: { type: string, enum: [vision_analysis, llm_text, diary_draft] }
                  data_categories: { type: array, items: { type: string, enum: [selected_media, user_text, schedule, wellness] } }
                  notice_id: { type: string, format: uuid }
                  notice_version: { type: string }
                  disclosure: { type: string }
                  provider_retention: { type: string }
                  vision_max_images: { type: integer, minimum: 1, maximum: 20, description: Vision only; maximum selected visual samples prepared and sent. }
                  vision_max_side: { type: integer, description: Vision only; maximum resized image side in pixels. }
                  vision_max_bytes_per_image: { type: integer, description: Vision only; maximum locally prepared JPEG bytes. }
                  estimated_cost_usd_max: { type: number, minimum: 0, description: 'Vision only: conservative reservation estimate for maximum samples, not a provider billing guarantee.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/consents:
    get:
      tags: [Privacy]
      operationId: listPrivacyConsents
      summary: List the current user's active external-processing consents
      responses:
        '200':
          description: Active consent scopes; no consent means deny
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PrivacyConsent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Privacy]
      operationId: grantPrivacyConsent
      summary: Record explicit, scoped consent for external processing
      description: >-
        The authenticated user must confirm the displayed notice. The server accepts
        only the OpenAI provider for supported purposes and stores exact selected media IDs
        for vision consent. This action does not
        itself send data to the provider. Consent is separate from publication approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyConsentGrant' }
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyConsent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /privacy/consents/{consent_id}:
    delete:
      tags: [Privacy]
      operationId: revokePrivacyConsent
      summary: Revoke consent; queued external calls must be rechecked and blocked
      description: >-
        A queued call that has not crossed the egress boundary is cancelled. A call
        already sent cannot be recalled; its recorded status must be disclosed.
      parameters:
        - $ref: '#/components/parameters/ConsentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Consent revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /trends/status:
    get:
      tags: [Trends]
      operationId: getCreatorTrendStatus
      summary: Read authenticated YouTube metadata search readiness without making a provider request
      responses:
        '200':
          description: Server-side activation and request limits; does not reveal the API key
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, daily_limit, cache_seconds]
                properties:
                  enabled: { type: boolean }
                  provider: { type: [string, 'null'], enum: [youtube_data_api, null] }
                  daily_limit: { type: integer, minimum: 0 }
                  cache_seconds: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /trends/search:
    get:
      tags: [Trends]
      operationId: searchCreatorTrendMetadata
      summary: Search recent short-video metadata from the official YouTube Data API
      description: Authenticated request; server-side key only. Disabled by default. No reference video/audio download or editing-effect inspection. At most 10 uncached live searches per UTC day; successful results are cached in memory for 15 minutes.
      parameters:
        - { name: topic, in: query, required: true, schema: { type: string, enum: [restaurant, cafe, travel] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: Metadata-only results or a clearly labeled local fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/style-references:
    get:
      tags: [Tasks]
      operationId: listCreatorStyleReferences
      summary: List owned style reference candidates and currently selected IDs
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Stored candidates; an unselected candidate does not change the content version
          content:
            application/json:
              schema:
                type: object
                required: [items, selected_ids]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StyleReference' } }
                  selected_ids: { type: array, items: { type: string, format: uuid } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      operationId: addCreatorStyleReference
      summary: Register a period trend, explicit search result, supported URL, or owned uploaded video
      description: Trend and search selection use only a fresh server cache; a period trend requires at least two relevant items. A YouTube URL may request official videos.list metadata only when live search is enabled and within the shared ten-request daily limit. Instagram and TikTok URLs are recorded without fetching media. An uploaded video is probed locally and sampled at 2fps for approximate screen-change times. No reference image or audio is copied to the output.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [trend, search, url, upload] }
                topic: { type: string, enum: [restaurant, cafe, travel] }
                days: { type: integer, minimum: 1, maximum: 90 }
                video_id: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
                url: { type: string, maxLength: 500, format: uri }
                media_id: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Candidate recorded without changing the approved content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StyleReference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/style-references/{reference_id}:
    delete:
      tags: [Tasks]
      operationId: deleteCreatorStyleReference
      summary: Delete an unselected owned reference candidate
      description: A reference selected by the current plan must first be deselected in a versioned scene edit.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - { name: reference_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /capabilities:
    get:
      tags: [Capabilities]
      operationId: listCapabilities
      summary: List enabled, allowlisted modules and their declared scopes
      responses:
        '200':
          description: Capability registry view; does not grant access to data or tools
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /assistant/messages:
    post:
      tags: [Assistant]
      operationId: submitAssistantMessage
      summary: Submit a text request or user-confirmed transcript to Yetu
      description: >-
        Casual conversation and feelings are not automatically recorded as Wellness or Diary data.
        Rule-based routing uses only the authenticated request and registered capabilities.
        Multiple record commands are split into separate confirmation requests. A Creator task_id permits
        planning only from media already attached to that owned task. This endpoint does
        not grant external-processing consent. Free talk is limited when the external LLM is off.
        OpenAI text interpretation requires a separate consent and sends only the current text.
        OpenAI visual analysis requires a prior
        server notice display and a matching consent_id; the LLM Gateway and PrivacyGate
        revalidate it immediately before dispatch.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantMessageRequest' }
      responses:
        '202':
          description: Accepted; may create a task requiring user review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantMessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /assistant/history:
    get:
      tags: [Assistant]
      operationId: listAssistantHistory
      summary: List the authenticated owner's locally stored recent Yetu conversation
      description: Up to 100 messages from the last 30 days are retained locally. Historical text is not automatically sent to an external LLM.
      responses:
        '200': { description: Owner-scoped recent messages and replies }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Assistant]
      operationId: clearAssistantHistory
      summary: Clear the authenticated owner's live Yetu conversation history
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Live conversation history cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /voice/transcriptions:
    post:
      tags: [Assistant]
      operationId: transcribeVoice
      summary: Transcribe submitted audio for user review
      description: >-
        Local transcription is the proposed default. Raw audio is not retained after
        processing. Cloud STT is not selected by this endpoint; any external STT call
        must go through the external-processing consent gate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary }
                locale: { type: string, description: 'Optional BCP-47 locale hint; exact allowlist is pending.' }
      responses:
        '200':
          description: Transcript returned for user review; never treated as approved instruction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcript' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/plan:
    put:
      tags: [Tasks]
      operationId: updateCreatorSceneTimeline
      summary: Reorder selected media and adjust scene durations or selected video start positions
      description: Uses the current content version and hash. The media IDs must be the same owned project items exactly once; durations must sum to target_seconds. Optional trend_query attaches only a still-cached, recent, relevant YouTube metadata summary; it never searches the API or proves video effects. Null clears a prior reference. A successful edit increments the content version and invalidates affected approvals.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorSceneEditRequest' }
      responses:
        '200':
          description: Updated storyboard and pending plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Tasks]
      operationId: getCreatorPlan
      summary: Read the current owned Creator storyboard and its approval checkpoint
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Current plan and generation provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: createOrReviseCreatorPlan
      summary: Generate a structured Creator storyboard and caption draft for a current owned task
      description: Uses only media already attached to the owned project. External AI is disabled by default and local rules are the fallback. Optional privacy_consent_id permits OpenAI visual analysis only when the server flag, key, and model are configured and PrivacyGate confirms owner, provider, purpose, resource IDs, categories, and active consent immediately before dispatch. Images are locally resized and metadata-stripped; selected video frames are locally extracted. Every revision increments content_version and invalidates all earlier task approvals. This endpoint does not render or publish.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorPlanRequest' }
      responses:
        '201':
          description: Plan stored on a new content version with a pending intermediate plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorPlanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Proposed policy or scope denial; the current single-owner reference adapter returns 404 for another owner's task.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/draft:
    get:
      tags: [Tasks]
      operationId: getCreatorCaptionDraft
      summary: Read captions after plan approval, including after a render failure
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Current version caption draft and its pending or approved continue checkpoint; a failed render does not revoke it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Tasks]
      operationId: reviseCreatorComposition
      summary: Revise captions, selected local music and audio settings
      description: Creates a new version and invalidates earlier approvals; the user must reapprove the plan and draft. Audio-only changes can reuse a previously verified video bitstream. Selected music must be an owned, uploaded library track; unverified rights permit private preview only.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatorDraftEdit' }
      responses:
        '200':
          description: New version and pending plan checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDraftEditResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks:
    get:
      tags: [Media]
      operationId: listLocalMusicTracks
      summary: List the authenticated owner's local music registrations
      responses:
        '200':
          description: Owner-scoped music metadata and user-attested rights
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MusicTrack' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Media]
      operationId: registerLocalMusicTrack
      summary: Register a user-selected local music file and rights evidence
      description: Creates metadata only; the user must separately upload the WAV or MP3 bytes. A user rights assertion is not an independent legal verification.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MusicTrackCreate' }
      responses:
        '201':
          description: Music registration awaiting its file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks/{track_id}/content:
    put:
      tags: [Media]
      operationId: uploadLocalMusicTrack
      summary: Upload only the selected music bytes to the owner's local library
      description: Size, declared SHA-256 and WAV/MP3 signature must match. Full decoding occurs during rendering; this signature check is not malware detection.
      parameters:
        - { in: path, name: track_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded track metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /music/tracks/{track_id}/rights:
    patch:
      tags: [Media, Rights]
      operationId: updateLocalMusicRights
      summary: Update user-attested rights and invalidate affected final approvals
      parameters:
        - { in: path, name: track_id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rights_revision, rights]
              properties:
                rights_revision: { type: integer, minimum: 1 }
                rights: { $ref: '#/components/schemas/MusicRights' }
      responses:
        '200':
          description: Updated track and incremented rights revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicTrack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Start an upload for media explicitly selected by the user
      description: >-
        Server accepts only declared upload parts. It must not enumerate or read
        other device/gallery files. Actual content type, size, digest and ownership
        are validated server-side. The current replaceable reference adapter accepts
        one selected item per session and one complete body at part_number=1. Each
        selected item is uploaded through a separate session. Multi-item sessions and
        resumable chunk semantics remain proposals pending approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadInitRequest' }
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads/{upload_id}/parts/{part_number}:
    put:
      tags: [Media]
      operationId: putUploadPart
      summary: Upload one declared part
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: part_number
          in: path
          required: true
          description: For multi-item sessions this is the 1-based item position. Single-item sessions still accept only part 1. Each file is sent in one part.
          schema: { type: integer, minimum: 1, maximum: 30 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Part accepted or identical retry acknowledged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        default: { $ref: '#/components/responses/Error' }
  /media/uploads/{upload_id}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Verify uploaded media and finalize the selected-media import
      description: >-
        Repeating completion for the same owner and manifest returns the existing
        import/media/proposal. This operation does not create a project or task;
        project creation is a separate idempotent operation.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCompleteRequest' }
      responses:
        '200':
          description: Import finalized; proposal is deduplicated by user and manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaImport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /media/{media_id}:
    get:
      tags: [Media]
      operationId: getMediaMetadata
      summary: Read metadata for an owned uploaded media item
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Metadata only; private local path is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /media/{media_id}/image-preview:
    get:
      tags: [Media]
      operationId: getOwnedImagePreview
      summary: Show an owned selected image in the local scene editor
      description: Bearer or same-origin HttpOnly web session required. The uploaded source bytes stay on the local PC and are returned with private no-store and nosniff headers. Videos have no preview on this route.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Owned JPEG, PNG or WebP bytes for local display
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects:
    get:
      tags: [Projects]
      operationId: listContentProjects
      summary: List the authenticated owner's Creator projects
      description: Reference adapter response for the Android and localhost PC clients; no other owner's projects or local storage paths are returned.
      responses:
        '200':
          description: Owned projects, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: createContentProject
      summary: Create a Creator project from owned uploaded media
      description: >-
        This proposed initial slice also creates an idle Creator task and returns its
        task_id so the client can poll GET /tasks/{task_id}. This additive response
        field is pending API contract approval. Repeating the same owner, ordered
        media_ids and project settings returns the same project/task even with a new
        idempotency key; changing settings creates a separate project.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: Project created in a reviewable initial state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getContentProject
      summary: Read an owned project and its current version
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project state and current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentProject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Projects]
      operationId: deleteContentProject
      summary: Delete an owned Creator project and its linked server records
      description: Requires the current version and hash. Active render jobs block deletion. Shared uploaded media and render files remain on local disk; project, task, checkpoint, approval, publication, job and related idempotency records are removed. LLM budget, privacy consent and other Agent data remain unchanged.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Deleted project receipt; repeating the same idempotency key returns this receipt
          content:
            application/json:
              schema:
                type: object
                required: [project_id, deleted, media_preserved, render_files_preserved]
                properties:
                  project_id: { type: string, format: uuid }
                  deleted: { type: boolean }
                  media_preserved: { type: boolean }
                  render_files_preserved: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /content/projects/{project_id}/rights:
    get:
      tags: [Rights]
      operationId: getRightsDecision
      summary: Evaluate rights for a version and intended platform/use
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: content_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: platform
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PublishPlatform' }
      responses:
        '200':
          description: Rights result; REVIEW and BLOCK are not publishable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RightsDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks:
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a work item for an enabled capability
      description: >-
        Creator is the MVP priority. Schedule/Wellness/Diary may be routed only when
        enabled and authorized. Blog/Music are future capabilities and are not
        enabled merely because their identifiers appear in this schema. The module
        validates the input object against its own schema and allowed data scopes.
        Task creation does not authorize external processing or broaden data access.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '202':
          description: Task accepted; status may await user input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Read task status, progress and next user action
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task status; sensitive source text is excluded from diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/checkpoints:
    get:
      tags: [Approvals]
      operationId: listCheckpoints
      summary: List review checkpoints for an owned task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Checkpoint list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Checkpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/jobs:
    get:
      tags: [Rendering]
      operationId: listTaskRenderJobs
      summary: List an owned task's render jobs for cross-device resume
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Render jobs, newest first, without local artifact paths
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/feedback:
    post:
      tags: [Tasks]
      operationId: submitTaskFeedback
      summary: Request a revision, pause or cancel at a review checkpoint
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [checkpoint_id, base_content_version, content_hash, action]
              properties:
                checkpoint_id: { type: string, format: uuid }
                base_content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                action: { type: string, enum: [revise, hold, cancel] }
                comment: { type: string, maxLength: 4000 }
      responses:
        '202':
          description: Feedback accepted; affected approvals are invalidated on revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/approvals:
    post:
      tags: [Approvals]
      operationId: createApproval
      summary: Record an explicit intermediate or final approval
      description: >-
        The server MUST validate the allowed checkpoint-kind/approval-scope matrix.
        In the first Creator render slice, plan and draft checkpoints require separate continue approvals bound to the same current version/hash; only then is task status render_ready.
        This generic checkpoint route records only continue approvals for plan, draft and preview checkpoints. Platform final approvals use the separate publication-specific approval route and bind a single publication ID. No approval can authorize external processing; that uses privacy consent separately.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '201':
          description: Approval evidence recorded for the exact current artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications:
    get:
      tags: [Publishing]
      operationId: listTaskPublications
      summary: List separately stored platform posting information for an owned task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Platform-specific records; one record per platform and task
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PublicationRecord' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Publishing]
      operationId: createTaskPublication
      summary: Save posting information for one platform; does not publish
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationInput' }
      responses:
        '201':
          description: Draft metadata saved; no platform request is made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications/{publication_id}:
    get:
      tags: [Publishing]
      operationId: getTaskPublication
      summary: Read one owned platform posting record
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Exact saved platform metadata and revision state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Publishing]
      operationId: updateTaskPublication
      summary: Update one platform record and invalidate its prior final approval
      description: Requires the current revision. Any changed field increments revision, invalidates approvals attached to this publication only and returns it to draft. No posting call is made.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PublicationInput'
                - type: object
                  required: [revision]
                  properties: { revision: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Updated draft metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/publications/{publication_id}/approvals:
    post:
      tags: [Publishing, Approvals]
      operationId: approvePublicationTarget
      summary: Explicitly approve one exact platform publication target
      description: Requires a current ffprobe-verified real FFmpeg artifact and an approved preview. Selected music and any audible source-video audio require explicit user rights verification, commercial permission, evidence, platform permission and required attribution in the publication description. Binds task version/hash, artifact hash, publication revision/hash, platform, account, visibility and text. Approval only changes metadata state to publish_ready; it does not post. A separate explicit YouTube upload request is available when configured. Other asset rights checks remain incomplete.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicationApprovalRequest' }
      responses:
        '201':
          description: Platform-specific final approval evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationApproval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /publications/youtube/connection:
    get:
      tags: [Publishing]
      operationId: getYouTubeConnection
      summary: Read the owned YouTube channel connection without returning tokens
      responses:
        '200':
          description: Local connection state; no Google request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YouTubeConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Publishing]
      operationId: disconnectYouTube
      summary: Delete local encrypted credentials and disable this channel connection
      description: Revocation is attempted with Google when available; local access is disabled even if revocation fails.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Disconnected without deleting publication or upload history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YouTubeConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: YouTube OAuth is not configured }
  /publications/youtube/connection/start:
    post:
      tags: [Publishing]
      operationId: startYouTubeConnection
      summary: Begin Google OAuth using one-time state and PKCE
      description: Requires server-side client credentials and an explicitly enabled live switch. No Google request is sent until the browser follows the returned authorization URL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Google authorization URL and ten-minute state lifetime
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_in_seconds]
                properties:
                  authorization_url: { type: string, format: uri }
                  expires_in_seconds: { type: integer, const: 600 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: YouTube OAuth is not configured }
  /publications/youtube/oauth/callback:
    get:
      tags: [Publishing]
      operationId: completeYouTubeConnection
      summary: Validate one-time state and exchange a Google authorization code
      description: Exact 127.0.0.1 loopback callback; redirects to the local web app without putting tokens or codes in the URL.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '303': { description: Connected and redirected to the local web app }
        '403': { description: State or upload scope is invalid }
        '503': { description: Google exchange or channel lookup failed }
  /tasks/{task_id}/publications/{publication_id}/youtube-upload:
    get:
      tags: [Publishing]
      operationId: listYouTubeUploads
      summary: List owner-scoped upload attempts for one YouTube publication
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
      responses:
        '200':
          description: Upload history; unknown outcomes require manual channel inspection
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/YouTubeUpload' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Publishing]
      operationId: uploadApprovedYouTubeVideo
      summary: Explicitly upload the current approved MP4 to its approved YouTube channel
      description: Rechecks ownership, current task and publication versions, final approval, preview, verified FFmpeg artifact and SHA-256, music and audible source rights, and the OAuth channel. One semantic upload per approval and artifact; uncertain outcomes block automatic retry. Live Google calls are disabled by default.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [made_for_kids]
              properties:
                made_for_kids: { type: boolean, description: Explicit audience selection for YouTube status.selfDeclaredMadeForKids. }
      responses:
        '200':
          description: Upload result or prior semantic attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YouTubeUpload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Provider unavailable or upload outcome uncertain }
  /tasks/{task_id}/render:
    post:
      tags: [Rendering]
      operationId: renderTask
      summary: Render a specified current content version
      description: >-
        Rendering creates a private preview; it does not authorize publishing. The server requires active plan and draft continue approvals for the current version/hash and obtains inputs only from the authenticated owner's project. Test renderer results are explicitly simulated, are not MP4, and are never marked artifact_verified.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_version, content_hash]
              properties:
                content_version: { type: integer, minimum: 1 }
                content_hash: { $ref: '#/components/schemas/Sha256' }
                render_profile: { type: string, enum: [vertical_9_16_h264_aac] }
                target_seconds: { type: integer, minimum: 3, maximum: 59, default: 30, description: Final output must remain shorter than 60 seconds. }
                framing: { type: string, enum: [fit_pad, fill_crop], default: fit_pad, description: fit_pad preserves the full source frame; fill_crop uses the supplied focal point. }
                focal_x: { type: number, minimum: 0, maximum: 1, default: 0.5 }
                focal_y: { type: number, minimum: 0, maximum: 1, default: 0.5 }
      responses:
        '202':
          description: Render job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}:
    get:
      tags: [Rendering]
      operationId: getJob
      summary: Poll an owned render or processing job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state and safe progress details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{task_id}/preview:
    get:
      tags: [Rendering]
      operationId: getTaskPreview
      summary: Retrieve a private preview for an owned task/version
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: content_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Private MP4 preview
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            video/mp4:
              schema: { type: string, format: binary }
            application/x-haejumi-test-preview:
              schema: { type: string, format: binary, description: Test renderer marker bytes only; never a video. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{job_id}/cancel:
    post:
      tags: [Rendering]
      operationId: cancelJob
      summary: Cancel an owned queued or running render job
      description: Cancellation is best effort once FFmpeg is running; a cancelled job cannot publish or expose a verified preview.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Current job state after cancellation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /publishes:
    post:
      tags: [Publishing]
      operationId: createPublish
      summary: Request publication of one exactly approved artifact
      description: >-
        Server MUST fail closed unless the authenticated owner, final_publish approval,
        current content version/hash and artifact SHA-256, platform/account/visibility/
        caption binding, rights=ALLOW, account authorization and idempotency record all
        match. Persist the idempotency record and durable outbox job before dispatch.
        Intermediate approval, voice transcript, or external-processing consent is not
        publication approval. If external outcome is uncertain, set outcome_unknown,
        do not upload again, and reconcile through the official platform API before
        marking success/failure. Never blind-retry an uncertain publication.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '202':
          description: New publication accepted after all server-side gates pass
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '200':
          description: Same idempotency key and request fingerprint; returns the existing publish job without dispatching a second publication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }
  /publishes/{publish_id}:
    get:
      tags: [Publishing]
      operationId: getPublish
      summary: Read publication status without triggering another publish
      parameters:
        - $ref: '#/components/parameters/PublishId'
      responses:
        '200':
          description: Publish status; mock and real outcomes are distinguished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /assistant/proposals/{proposal_id}/confirm:
    post:
      tags: [Supervisor]
      operationId: confirmLocalAssistantProposal
      summary: Confirm one owner-scoped local write proposal
      description: A proposal expires after one hour. The endpoint never approves diary final saving or SNS publishing.
      parameters:
        - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Confirmed local action result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /schedule/occurrences:
    get:
      tags: [Schedule]
      operationId: listScheduleOccurrences
      summary: Expand stored recurrence rules for a bounded date range
      description: Date range is limited to 366 days. This endpoint does not schedule or deliver notifications. Recurrences retain the original numeric UTC offset; daylight-saving time zone transitions are not yet modeled.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Owner-scoped occurrence list }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/events:
    get:
      tags: [Schedule]
      operationId: listScheduleEvents
      summary: List authenticated owner's local schedule events
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Owner-scoped items }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Schedule]
      operationId: createScheduleEvent
      summary: Create a local event with optional stored recurrence and reminder preference
      description: Reminder delivery is not implemented and cannot be guaranteed while the PC is off.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleEventInput' }
      responses:
        '201': { description: Created event }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/events/{event_id}:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Schedule]
      operationId: getScheduleEvent
      summary: Get one owned schedule event
      responses:
        '200': { description: Owned event }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Schedule]
      operationId: editScheduleEvent
      summary: Revise one owned schedule event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: New event version }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Schedule]
      operationId: deleteScheduleEvent
      summary: Soft delete one owned schedule event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Soft deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /schedule/google/connection:
    get:
      tags: [Schedule]
      operationId: getGoogleCalendarConnection
      summary: Read owner-scoped Google Calendar connection state
      description: Production remains unconfigured during the Mock-only phase. No external request is made.
      responses:
        '200': { description: Connection status without tokens }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Schedule]
      operationId: disconnectGoogleCalendar
      summary: Disable local token use and disconnect this owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Disconnected; existing local schedule data retained }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Google provider not configured }
  /schedule/google/connection/start:
    post:
      tags: [Schedule]
      operationId: startGoogleCalendarConnection
      summary: Begin owner-authenticated OAuth with state and PKCE
      description: Mock provider injection only; the production server does not initiate real Google OAuth in this phase.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Authorization URL and short lifetime; no token }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Google provider not configured }
  /schedule/google/oauth/callback:
    get:
      tags: [Schedule]
      operationId: completeGoogleCalendarConnection
      summary: Validate one-time OAuth state and exchange an authorization code
      description: Local loopback callback; state is owner-bound and expires after 10 minutes. Mock tests only in this phase.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Connection status without tokens }
        '403': { description: Invalid state or missing scope }
        '503': { description: Provider unavailable or not configured }
  /schedule/google/events:
    get:
      tags: [Schedule]
      operationId: listGoogleCalendarEvents
      summary: Fetch owned primary-calendar events on explicit request
      description: Separate from local events. The provider is a Mock during this phase; no background polling or notifications.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: Owner-scoped Google event list with source and sync state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Disconnected or expired OAuth }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/google/events/{google_event_id}:
    parameters:
      - { name: google_event_id, in: path, required: true, schema: { type: string, pattern: '^[a-v0-9]{5,1024}$' } }
    get:
      tags: [Schedule]
      operationId: getGoogleCalendarEvent
      summary: Refetch one Google event before viewing or editing
      responses:
        '200': { description: Current event with ETag and source }
        '404': { $ref: '#/components/responses/NotFound' }
  /schedule/google/proposals:
    post:
      tags: [Schedule]
      operationId: proposeGoogleCalendarChange
      summary: Prepare a Google create, update, or delete without executing it
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [create, update, delete] }
                google_event_id: { type: string, pattern: '^[a-v0-9]{5,1024}$' }
                etag: { type: string, minLength: 1 }
                event: { $ref: '#/components/schemas/GoogleScheduleEventInput' }
      responses:
        '201': { description: Ten-minute owner-scoped preview; no Google write }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /schedule/google/proposals/{proposal_id}/confirm:
    parameters:
      - { name: proposal_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Schedule]
      operationId: confirmGoogleCalendarChange
      summary: Execute one current owner-approved proposal with ETag and idempotency checks
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Confirmed result or idempotent replay }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: External outcome unknown; automatic retry is prohibited }
  /wellness/entries:
